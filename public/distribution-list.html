<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愛知県 保育園・幼稚園リスト | こだわりん</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root {
    --bg: #f5f3ef; --surface: #fff; --surface2: #faf9f6;
    --primary: #2d6a4f; --primary-light: #52b788; --accent: #f4a261;
    --text: #1a1a1a; --text-sub: #666; --border: #e0ddd6;
    --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .nav { background: var(--primary); padding: 0 24px; display: flex; align-items: center; gap: 8px; height: 52px; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .nav-brand { color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; }
  .nav-sep { color: rgba(255,255,255,.4); margin: 0 4px; }
  .nav-page { color: rgba(255,255,255,.85); font-size: 14px; }

  .header { background: var(--primary); color: white; padding: 28px 24px; }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .header p { font-size: 13px; opacity: .8; }

  .stats-bar { background: var(--primary-light); padding: 12px 24px; display: flex; gap: 24px; flex-wrap: wrap; }
  .stat-item { color: white; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .stat-num { font-size: 20px; font-weight: 700; line-height: 1; }

  /* タブ */
  .tabs { background: var(--surface); border-bottom: 2px solid var(--border); display: flex; padding: 0 16px; position: sticky; top: 52px; z-index: 150; }
  .tab { padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; color: var(--text-sub); transition: all .15s; white-space: nowrap; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover { color: var(--primary); }

  .main { padding: 20px 16px; max-width: 1400px; margin: 0 auto; }

  /* フィルターパネル */
  .filter-panel { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 11px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: .05em; }
  .fg-search { flex: 2; min-width: 200px; }
  .fg-search input { height: 38px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-family: inherit; font-size: 14px; background: var(--surface2); outline: none; transition: border-color .15s; width: 100%; }
  .fg-search input:focus { border-color: var(--primary-light); background: #fff; }

  /* マルチセレクト */
  .ms-wrap { position: relative; min-width: 130px; }
  .ms-trigger { height: 38px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 30px 0 12px; font-family: inherit; font-size: 13px; background: var(--surface2); cursor: pointer; display: flex; align-items: center; user-select: none; transition: border-color .15s; position: relative; }
  .ms-trigger:hover, .ms-wrap.open .ms-trigger { border-color: var(--primary-light); background: #fff; }
  .ms-arrow { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--text-sub); transition: transform .15s; pointer-events: none; }
  .ms-wrap.open .ms-arrow { transform: translateY(-50%) rotate(180deg); }
  .ms-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .ms-badge { display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: #fff; border-radius: 10px; font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; flex-shrink: 0; }
  .ms-dropdown { position: absolute; top: calc(100% + 4px); left: 0; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 300; min-width: 200px; max-width: 280px; display: none; overflow: hidden; }
  .ms-wrap.open .ms-dropdown { display: block; }
  .ms-search-wrap { padding: 8px; border-bottom: 1px solid var(--border); }
  .ms-search { width: 100%; height: 30px; border: 1.5px solid var(--border); border-radius: 6px; padding: 0 8px; font-family: inherit; font-size: 12px; background: var(--surface2); outline: none; }
  .ms-search:focus { border-color: var(--primary-light); }
  .ms-actions { display: flex; border-bottom: 1px solid var(--border); }
  .ms-act { flex: 1; padding: 6px; font-size: 11px; font-family: inherit; background: none; border: none; cursor: pointer; color: var(--text-sub); }
  .ms-act:hover { background: var(--surface2); color: var(--primary); }
  .ms-act:first-child { border-right: 1px solid var(--border); }
  .ms-list { max-height: 220px; overflow-y: auto; padding: 4px 0; }
  .ms-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; transition: background .1s; }
  .ms-item:hover { background: var(--surface2); }
  .ms-item.checked { background: #f0faf4; }
  .ms-cb { width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: white; }
  .ms-item.checked .ms-cb { background: var(--primary); border-color: var(--primary); }
  .ms-item.checked .ms-cb::after { content: "✓"; color: white; font-size: 10px; font-weight: 700; }
  .ms-item-lbl { flex: 1; }
  .ms-item-cnt { font-size: 11px; color: var(--text-sub); }
  .ms-empty { padding: 16px 12px; text-align: center; color: var(--text-sub); font-size: 12px; }

  .btn-reset, .btn-export { height: 38px; padding: 0 16px; border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; align-self: flex-end; transition: all .15s; }
  .btn-reset { background: var(--surface2); border: 1.5px solid var(--border); color: var(--text-sub); }
  .btn-reset:hover { background: var(--border); }
  .btn-export { background: var(--primary); border: none; color: #fff; font-weight: 600; }
  .btn-export:hover { background: #1e4d38; }

  .active-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; background: #e8f5ee; color: var(--primary); border: 1px solid #b2dfcc; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
  .tag-x { cursor: pointer; opacity: .6; }
  .tag-x:hover { opacity: 1; }

  .result-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--text-sub); }
  .result-meta strong { color: var(--primary); font-size: 16px; }

  /* テーブル共通 */
  .table-wrap { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
  .tscroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: var(--primary); color: #fff; }
  thead th { padding: 11px 12px; text-align: left; font-weight: 600; font-size: 12px; white-space: nowrap; cursor: pointer; user-select: none; letter-spacing: .02em; }
  thead th:hover { background: #235940; }
  thead th .si { opacity: .5; font-size: 10px; margin-left: 3px; }
  thead th.sorted .si { opacity: 1; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f0ede6; }
  tbody td { padding: 10px 12px; vertical-align: middle; }
  .td-num { color: var(--text-sub); font-size: 11px; width: 36px; }
  .td-name { font-weight: 500; min-width: 160px; }
  .td-city { min-width: 70px; }
  .td-addr { color: var(--text-sub); font-size: 12px; min-width: 180px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-public  { background: #dbeafe; color: #1e40af; }
  .badge-private { background: #fce7f3; color: #9d174d; }
  .badge-hoiku   { background: #d1fae5; color: #065f46; }
  .badge-kodomo  { background: #fef3c7; color: #92400e; }
  .badge-ev-only  { background: #fff3e0; color: #e65100; }
  .badge-yochien  { background: #e8eaf6; color: #283593; }
  .badge-small    { background: #fce4ec; color: #880e4f; }

  .status-select { border: 1.5px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-family: inherit; background: var(--surface2); cursor: pointer; outline: none; }
  .status-0 { border-color: #d1d5db; color: #6b7280; }
  .status-1 { border-color: #fbbf24; color: #d97706; background: #fffbeb; }
  .status-2 { border-color: #34d399; color: #065f46; background: #ecfdf5; }
  .status-3 { border-color: #60a5fa; color: #1d4ed8; background: #eff6ff; }
  .status-4 { border-color: #a78bfa; color: #5b21b6; background: #f5f3ff; }

  .memo-input { border: 1.5px solid transparent; border-radius: 6px; padding: 3px 6px; font-size: 12px; font-family: inherit; background: transparent; width: 120px; }
  .memo-input:hover { border-color: var(--border); background: var(--surface2); }
  .memo-input:focus { border-color: var(--primary-light); background: #fff; outline: none; }

  /* ===== イベント列 ===== */
  .ev-cell { text-align: center; min-width: 52px; padding: 6px 4px !important; }
  .ev-chip { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 24px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .ev-chip.has { background: #d1fae5; color: #065f46; cursor: default; }
  .ev-chip.none { background: #f3f4f6; color: #d1d5db; }
  th.ev-th { min-width: 52px; font-size: 10px; writing-mode: vertical-rl; text-orientation: mixed; padding: 12px 6px !important; height: 80px; vertical-align: bottom; white-space: nowrap; }

  /* イベント一覧ビュー */
  .ev-view { display: none; }
  .ev-sub-row { background: #f0f8f4 !important; }
  .ev-sub-cell { padding: 5px 14px 8px 30px !important; border-bottom: 2px solid var(--border) !important; }
  .ev-sub-chip { display: inline-block; background: var(--primary); color: #fff; border-radius: 10px; padding: 2px 9px; font-size: 11px; margin: 2px 3px; font-weight: 600; white-space: nowrap; }
  .ev-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .ev-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
  .ev-card-head { background: var(--primary); color: #fff; padding: 14px 16px; }
  .ev-card-head h3 { font-size: 15px; font-weight: 700; }
  .ev-card-head p { font-size: 12px; opacity: .8; margin-top: 2px; }
  .ev-card-body { padding: 0; }
  .ev-garden-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ev-garden-row:last-child { border-bottom: none; }
  .ev-garden-name { flex: 1; }
  .ev-count-badge { background: var(--primary-light); color: #fff; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .ev-in-list { font-size: 11px; color: var(--primary); margin-left: 8px; }

  /* ページネーション */
  .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 14px; background: var(--surface); border-top: 1px solid var(--border); }
  .page-btn { min-width: 34px; height: 34px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface2); font-size: 13px; cursor: pointer; font-family: inherit; color: var(--text); padding: 0 8px; }
  .page-btn:hover { border-color: var(--primary-light); color: var(--primary); }
  .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
  .page-btn:disabled { opacity: .4; cursor: not-allowed; }
  .page-info { font-size: 12px; color: var(--text-sub); padding: 0 8px; }

  .empty { text-align: center; padding: 60px 24px; color: var(--text-sub); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  @media(max-width:600px) {
    .filter-row { flex-direction: column; }
    .ms-wrap { min-width: 100%; }
    th.ev-th { height: 60px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand">こだわりん Workflow</a>
  <span class="nav-sep">›</span>
  <span class="nav-page">保育園・幼稚園リスト</span>
</nav>

<div class="header">
  <h1>🌱 愛知県 保育園・幼稚園リスト</h1>
  <p>愛知県公式データ（令和7年4〜5月時点）＋ イベント配布実績のみの園を含む。アプローチ状況管理・CSVエクスポート対応。</p>
</div>

<div class="stats-bar">
  <div class="stat-item"><span class="stat-num" id="stat-total">—</span> 件 登録</div>
  <div class="stat-item">🏛 公立 <span class="stat-num" id="stat-pub">—</span></div>
  <div class="stat-item">🏫 私立 <span class="stat-num" id="stat-pri">—</span></div>
  <div class="stat-item">📍 <span id="stat-city-count">—</span></div>
  <div class="stat-item">🎪 イベント実績 <span class="stat-num" id="stat-ev-count">—</span> 回</div>
  <div class="stat-item">📋 配布実績のみ <span class="stat-num" id="stat-ev-only">—</span> 園</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('list')" id="tab-list">📋 園リスト</div>
  <div class="tab" onclick="switchTab('event')" id="tab-event">🎪 イベント別実績</div>
</div>

<div class="main">

  <!-- ===== 共通フィルター ===== -->
  <div class="filter-panel" id="filter-panel">
    <div class="filter-row">
      <div class="filter-group fg-search">
        <label>🔍 園名・住所で検索</label>
        <input type="text" id="q" placeholder="例：保育園、名古屋市、緑区..." oninput="onFilter()">
      </div>
      <div class="filter-group" id="fg-city">
        <label>市区町村</label>
        <div class="ms-wrap" id="ms-city">
          <div class="ms-trigger" onclick="toggleMs('ms-city')">
            <span class="ms-label" id="ms-city-lbl">すべて</span>
            <span class="ms-badge" id="ms-city-cnt" style="display:none"></span>
            <span class="ms-arrow">▼</span>
          </div>
          <div class="ms-dropdown">
            <div class="ms-search-wrap"><input class="ms-search" type="text" placeholder="市区町村を検索..." oninput="filterMsList(this,'ms-city')"></div>
            <div class="ms-actions"><button class="ms-act" onclick="selAll('ms-city')">すべて選択</button><button class="ms-act" onclick="clrMs('ms-city')">クリア</button></div>
            <div class="ms-list" id="ms-city-list"></div>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <label>種類</label>
        <div class="ms-wrap" id="ms-type">
          <div class="ms-trigger" onclick="toggleMs('ms-type')">
            <span class="ms-label" id="ms-type-lbl">すべて</span>
            <span class="ms-badge" id="ms-type-cnt" style="display:none"></span>
            <span class="ms-arrow">▼</span>
          </div>
          <div class="ms-dropdown">
            <div class="ms-actions"><button class="ms-act" onclick="selAll('ms-type')">すべて選択</button><button class="ms-act" onclick="clrMs('ms-type')">クリア</button></div>
            <div class="ms-list" id="ms-type-list"></div>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <label>公立 / 私立</label>
        <div class="ms-wrap" id="ms-pub">
          <div class="ms-trigger" onclick="toggleMs('ms-pub')">
            <span class="ms-label" id="ms-pub-lbl">すべて</span>
            <span class="ms-badge" id="ms-pub-cnt" style="display:none"></span>
            <span class="ms-arrow">▼</span>
          </div>
          <div class="ms-dropdown">
            <div class="ms-actions"><button class="ms-act" onclick="selAll('ms-pub')">すべて選択</button><button class="ms-act" onclick="clrMs('ms-pub')">クリア</button></div>
            <div class="ms-list" id="ms-pub-list"></div>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <label>アプローチ状況</label>
        <div class="ms-wrap" id="ms-status">
          <div class="ms-trigger" onclick="toggleMs('ms-status')">
            <span class="ms-label" id="ms-status-lbl">すべて</span>
            <span class="ms-badge" id="ms-status-cnt" style="display:none"></span>
            <span class="ms-arrow">▼</span>
          </div>
          <div class="ms-dropdown">
            <div class="ms-actions"><button class="ms-act" onclick="selAll('ms-status')">すべて選択</button><button class="ms-act" onclick="clrMs('ms-status')">クリア</button></div>
            <div class="ms-list" id="ms-status-list"></div>
          </div>
        </div>
      </div>
      <div class="filter-group" id="fg-ev-filter">
        <label>イベント</label>
        <div class="ms-wrap" id="ms-ev">
          <div class="ms-trigger" onclick="toggleMs('ms-ev')">
            <span class="ms-label" id="ms-ev-lbl">すべて</span>
            <span class="ms-badge" id="ms-ev-cnt" style="display:none"></span>
            <span class="ms-arrow">▼</span>
          </div>
          <div class="ms-dropdown">
            <div class="ms-actions"><button class="ms-act" onclick="selAll('ms-ev')">すべて選択</button><button class="ms-act" onclick="clrMs('ms-ev')">クリア</button></div>
            <div class="ms-list" id="ms-ev-list"></div>
          </div>
        </div>
      </div>
      <div class="filter-group" id="fg-place-filter">
        <label>会場名</label>
        <div class="ms-wrap" id="ms-place">
          <div class="ms-trigger" onclick="toggleMs('ms-place')">
            <span class="ms-label" id="ms-place-lbl">すべて</span>
            <span class="ms-badge" id="ms-place-cnt" style="display:none"></span>
            <span class="ms-arrow">▼</span>
          </div>
          <div class="ms-dropdown">
            <div class="ms-actions"><button class="ms-act" onclick="selAll('ms-place')">すべて選択</button><button class="ms-act" onclick="clrMs('ms-place')">クリア</button></div>
            <div class="ms-list" id="ms-place-list"></div>
          </div>
        </div>
      </div>
      <button class="btn-reset" onclick="resetFilter()">リセット</button>
      <button class="btn-export" onclick="exportCSV()">📥 CSV出力</button>
    </div>
    <div class="active-tags" id="active-tags"></div>
  </div>

  <!-- ===== 園リストビュー ===== -->
  <div id="list-view">
    <div class="result-meta">
      <div><strong id="result-count">—</strong> 件 表示中</div>
      <div id="page-info-top" style="font-size:12px;color:var(--text-sub)"></div>
    </div>
    <div class="table-wrap">
      <div class="tscroll">
        <table id="main-table">
          <thead id="main-thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- ===== イベント別実績ビュー ===== -->
  <div id="event-view" class="ev-view">
    <div class="result-meta">
      <div><strong id="ev-result-count">—</strong> イベント表示中</div>
    </div>

    <!-- サマリーテーブル -->
    <div id="ev-summary-wrap" style="margin-bottom:20px; overflow-x:auto;">
      <table id="ev-summary-table" style="border-collapse:collapse; font-size:13px; width:100%; max-width:680px; background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);">
        <thead>
          <tr style="background:var(--primary); color:#fff; text-align:left;">
            <th style="padding:10px 14px;">📅 イベント</th>
            <th style="padding:10px 14px; text-align:right;">配布園数</th>
            <th style="padding:10px 14px; text-align:right;">配布枚数合計</th>
          </tr>
        </thead>
        <tbody id="ev-summary-tbody"></tbody>
        <tfoot>
          <tr id="ev-summary-foot" style="background:var(--primary-light); color:#fff; font-weight:700;">
            <td style="padding:10px 14px;">合計（延べ）</td>
            <td style="padding:10px 14px; text-align:right;" id="ev-summary-total-g">—</td>
            <td style="padding:10px 14px; text-align:right;" id="ev-summary-total-c">—</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="ev-card-grid" id="ev-card-grid"></div>
  </div>

MS_CFG['ms-place'] = { field:'_place', items: PLACES.map(p=>({label:p,val:p})), selected: new Set() };

Object.keys(MS_CFG).forEach(id => renderMsList(id,''));

function renderMsList(id, q) {
  const cfg = MS_CFG[id];
  const list = document.getElementById(id+'-list');
  if (!list) return;
  list.innerHTML = '';
  const isObj = cfg.items.length > 0 && typeof cfg.items[0] === 'object';
  
  // 件数カウント
  let counts = {};
  if (id === 'ms-ev') {
    // イベントごとの配布園数
    EVENTS_LIST.forEach(ev => {
      counts[ev] = Object.keys(EVENTS_MAP[ev]||{}).length;
    });
  } else if (id === 'ms-place') {
    // 会場ごとの配布園数（ユニーク）
    PLACES.forEach(place => {
      const evs = EVENTS_LIST.filter(ev => ev.endsWith(' '+place));
      const gs = new Set();
      evs.forEach(ev => Object.keys(EVENTS_MAP[ev]||{}).forEach(g => gs.add(g)));
      counts[place] = gs.size;
    });
  } else {
    DATA.forEach(d => {
      const v = String(d[cfg.field]);
      counts[v] = (counts[v]||0)+1;
    });
  }

  const items = cfg.items.filter(item => {
    const label = isObj ? item.label : String(item);
    return label.toLowerCase().includes(q.toLowerCase());
  });

  if (items.length === 0) { list.innerHTML='<div class="ms-empty">見つかりません</div>'; return; }
  items.forEach(item => {
    const val = isObj ? item.val : String(item);
    const label = isObj ? item.label : String(item);
    const checked = cfg.selected.has(val);
    const cnt = counts[val] || 0;
    const el = document.createElement('div');
    el.className = 'ms-item'+(checked?' checked':'');
    el.innerHTML = `<div class="ms-cb"></div><span class="ms-item-lbl">${escH(label)}</span><span class="ms-item-cnt">${cnt}</span>`;
    el.onclick = () => { cfg.selected.has(val) ? cfg.selected.delete(val) : cfg.selected.add(val); el.classList.toggle('checked'); updMsTrigger(id); onFilter(); };
    list.appendChild(el);
  });
}

function filterMsList(input, id) { renderMsList(id, input.value); }

function toggleMs(id) {
  const wrap = document.getElementById(id);
  const was = wrap.classList.contains('open');
  Object.keys(MS_CFG).forEach(k => { const w=document.getElementById(k); if(w) w.classList.remove('open'); });
  if (!was) wrap.classList.add('open');
}

function selAll(id) {
  const cfg = MS_CFG[id];
  const isObj = cfg.items.length > 0 && typeof cfg.items[0]==='object';
  cfg.items.forEach(item => cfg.selected.add(isObj ? item.val : String(item)));
  renderMsList(id,''); updMsTrigger(id); onFilter();
}
function clrMs(id) { MS_CFG[id].selected.clear(); renderMsList(id,''); updMsTrigger(id); onFilter(); }

function updMsTrigger(id) {
  const cfg = MS_CFG[id];
  const cnt = cfg.selected.size;
  const lblEl = document.getElementById(id+'-lbl');
  const cntEl = document.getElementById(id+'-cnt');
  if (!lblEl) return;
  if (cnt === 0) { lblEl.textContent='すべて'; cntEl.style.display='none'; return; }
  const isObj = cfg.items.length > 0 && typeof cfg.items[0]==='object';
  if (cnt === 1) {
    const val = [...cfg.selected][0];
    if (id==='ms-status') lblEl.textContent = STATUS_LABELS[parseInt(val)];
    else lblEl.textContent = val;
  } else {
    lblEl.textContent = cnt+'件選択中';
  }
  cntEl.textContent = cnt; cntEl.style.display='';
}

document.addEventListener('click', e => {
  if (!e.target.closest('.ms-wrap')) Object.keys(MS_CFG).forEach(k => { const w=document.getElementById(k); if(w) w.classList.remove('open'); });
});

// ===== フィルター =====
function onFilter() {
  const q = document.getElementById('q').value.toLowerCase();
  filtered = DATA.filter(d => {
    if (q && !d.園名.toLowerCase().includes(q) && !d.住所.toLowerCase().includes(q) && !d.市区町村.includes(q)) return false;
    if (MS_CFG['ms-city'].selected.size>0 && !MS_CFG['ms-city'].selected.has(d.市区町村)) return false;
    if (MS_CFG['ms-type'].selected.size>0 && !MS_CFG['ms-type'].selected.has(d.種類)) return false;
    if (MS_CFG['ms-pub'].selected.size>0 && !MS_CFG['ms-pub'].selected.has(d.私立公立)) return false;
    if (MS_CFG['ms-status'].selected.size>0 && !MS_CFG['ms-status'].selected.has(String(d._status))) return false;
    if (MS_CFG['ms-ev'].selected.size>0) {
      const hasAny = [...MS_CFG['ms-ev'].selected].some(ev => d._ev[ev] !== undefined);
      if (!hasAny) return false;
    }
    // 会場名フィルター：その会場のいずれかのイベントで配布実績があるか
    if (MS_CFG['ms-place'].selected.size>0) {
      const hasPlace = [...MS_CFG['ms-place'].selected].some(place =>
        EVENTS_LIST.filter(ev=>ev.endsWith(' '+place)).some(ev => d._ev[ev] !== undefined)
      );
      if (!hasPlace) return false;
    }
    return true;
  });
  if (sortKey) applySort();
  currentPage = 1;
  renderActiveTags();
  if (currentTab==='list') renderList();
  else renderEventView();
}

function applySort() {
  filtered.sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'number' && typeof bv === 'number') return sortAsc ? av-bv : bv-av;
    return sortAsc ? String(av||'').localeCompare(String(bv||''),'ja') : String(bv||'').localeCompare(String(av||''),'ja');
  });
}

function resetFilter() {
  document.getElementById('q').value='';
  Object.keys(MS_CFG).forEach(id => { MS_CFG[id].selected.clear(); renderMsList(id,''); updMsTrigger(id); });
  onFilter();
}

function renderActiveTags() {
  const c = document.getElementById('active-tags'); c.innerHTML='';
  const q = document.getElementById('q').value;
  if (q) addTag(c, '検索: '+q, ()=>{document.getElementById('q').value='';onFilter();});
  const addMsTags = (id, fn) => MS_CFG[id].selected.forEach(v => addTag(c, fn(v), ()=>{MS_CFG[id].selected.delete(v);renderMsList(id,'');updMsTrigger(id);onFilter();}));
  addMsTags('ms-city', v=>v);
  addMsTags('ms-type', v=>v.replace('認定こども園（','').replace('）',''));
  addMsTags('ms-pub', v=>v);
  addMsTags('ms-status', v=>STATUS_LABELS[parseInt(v)]);
  addMsTags('ms-ev', v=>evShortLabel(v));
  addMsTags('ms-place', v=>'会場: '+v);
}
function addTag(c, text, onRemove) {
  const t = document.createElement('span'); t.className='tag';
  t.innerHTML=`${escH(text)} <span class="tag-x" onclick="(${onRemove})()">×</span>`;
  c.appendChild(t);
}

// ===== タブ切り替え =====
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-list').classList.toggle('active', tab==='list');
  document.getElementById('tab-event').classList.toggle('active', tab==='event');
  document.getElementById('list-view').style.display = tab==='list' ? 'block' : 'none';
  document.getElementById('event-view').style.display = tab==='event' ? 'block' : 'none';
  if (tab==='list') renderList(); else renderEventView();
}

// ===== 園リストビュー =====
function buildListHeader() {
  const thead = document.getElementById('main-thead');
  const evCols = EVENTS_LIST.map(ev => {
    // "2026/03/22 名駅北" → "260322 名駅北"
    const m = ev.match(/^(\d{4})\/(\d{2})\/(\d{2}) (.+)$/);
    const short = m ? `${m[1].slice(2)}${m[2]}${m[3]} ${m[4]}` : ev;
    return `<th class="ev-th" onclick="sortBy('_ev_count')" title="${escH(ev)}">${escH(short)}<span class="si">↕</span></th>`;
  }).join('');
  thead.innerHTML = `<tr>
    <th class="td-num">#</th>
    <th onclick="sortBy('園名')">園名<span class="si">↕</span></th>
    <th onclick="sortBy('市区町村')">市区町村<span class="si">↕</span></th>
    <th onclick="sortBy('種類')">種類<span class="si">↕</span></th>
    <th onclick="sortBy('私立公立')">公私<span class="si">↕</span></th>
    <th>住所</th>
    ${evCols}
    <th onclick="sortBy('_ev_count')">配布<br>回数<span class="si">↕</span></th>
    <th>アプローチ<br>状況</th>
    <th>メモ</th>
  </tr>`;
}

function sortBy(key) {
  sortKey === key ? sortAsc = !sortAsc : (sortKey=key, sortAsc=true);
  onFilter();
}

function renderList() {
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage-1)*PAGE_SIZE;
  const page = filtered.slice(start, start+PAGE_SIZE);

  document.getElementById('result-count').textContent = total.toLocaleString();
  document.getElementById('page-info-top').textContent = `${currentPage} / ${totalPages} ページ`;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML='';

  if (page.length===0) {
    tbody.innerHTML=`<tr><td colspan="${8+EVENTS_LIST.length}"><div class="empty"><div class="empty-icon">🔍</div>条件に一致する園が見つかりません</div></td></tr>`;
  } else {
    page.forEach((d,i) => {
      const evCells = EVENTS_LIST.map(ev => {
        const cnt = d._ev[ev];
        if (cnt !== undefined) return `<td class="ev-cell"><span class="ev-chip has" title="${escH(ev)}: ${cnt}枚">${cnt}</span></td>`;
        return `<td class="ev-cell"><span class="ev-chip none">—</span></td>`;
      }).join('');
      const typeShort = d.種類.replace('認定こども園（','').replace('）','').replace('幼保連携型','連携型');
      const tr = document.createElement('tr');
      if (d._ev_count > 0) tr.style.background = '#f8fdf9';
      tr.innerHTML = `
        <td class="td-num">${start+i+1}</td>
        <td class="td-name">${escH(d.園名)}</td>
        <td class="td-city">${escH(d.市区町村)}</td>
        <td><span class="badge ${getBadgeType(d.種類)}">${escH(typeShort)}</span></td>
        <td><span class="badge ${d.私立公立==='公立'?'badge-public':'badge-private'}">${d.私立公立}</span></td>
        <td class="td-addr">${escH(d.住所)}</td>
        ${evCells}
        <td style="text-align:center;font-weight:700;color:${d._ev_count>0?'var(--primary)':'var(--text-sub)'}">${d._ev_count > 0 ? d._ev_count+'回' : '—'}</td>
        <td><select class="status-select ${STATUS_COLORS[d._status]}" onchange="updateStatus(${d._id},this)">${STATUS_LABELS.map((l,j)=>`<option value="${j}" ${j===d._status?'selected':''}>${l}</option>`).join('')}</select></td>
        <td><input class="memo-input" type="text" value="${escH(d._memo)}" placeholder="メモ..." maxlength="50" onchange="updateMemo(${d._id},this.value)" onfocus="this.select()"></td>
      `;
      tbody.appendChild(tr);

      // ===== イベント配布実績サブ行 =====
      if (d._ev_count > 0) {
        const evEntries = EVENTS_LIST
          .filter(ev => d._ev[ev] !== undefined)
          .map(ev => {
            const m = ev.match(/^(\d{4})\/(\d{2})\/(\d{2}) (.+)$/);
            const label = m ? `${m[1].slice(2)}${m[2]}${m[3]} ${m[4]}` : ev;
            return `<span class="ev-sub-chip" title="${escH(ev)}">${escH(label)}：${d._ev[ev]}枚</span>`;
          }).join('');
        const totalCols = 7 + EVENTS_LIST.length;
        const subTr = document.createElement('tr');
        subTr.className = 'ev-sub-row';
        subTr.innerHTML = `<td colspan="${totalCols}" class="ev-sub-cell">📬 ${evEntries}</td>`;
        tbody.appendChild(subTr);
      }
    });
  }
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pg = document.getElementById('pagination'); pg.innerHTML='';
  if (totalPages<=1) return;
  const add=(label,page,active,disabled)=>{
    const b=document.createElement('button'); b.className='page-btn'+(active?' active':'');
    b.textContent=label; b.disabled=disabled;
    b.onclick=()=>{currentPage=page;renderList();window.scrollTo(0,0);};
    pg.appendChild(b);
  };
  add('«',1,false,currentPage===1); add('‹',currentPage-1,false,currentPage===1);
  const s=Math.max(1,currentPage-2),e=Math.min(totalPages,currentPage+2);
  for(let p=s;p<=e;p++) add(p,p,p===currentPage,false);
  add('›',currentPage+1,false,currentPage===totalPages); add('»',totalPages,false,currentPage===totalPages);
  const info=document.createElement('span'); info.className='page-info'; info.textContent=`全 ${filtered.length.toLocaleString()} 件`; pg.appendChild(info);
}

// ===== イベント別ビュー =====
function renderEventView() {
  // 表示するイベント：イベントフィルター > 会場フィルター > 全件
  let selEvs;
  if (MS_CFG['ms-ev'].selected.size > 0) {
    selEvs = [...MS_CFG['ms-ev'].selected];
  } else if (MS_CFG['ms-place'].selected.size > 0) {
    selEvs = EVENTS_LIST.filter(ev =>
      [...MS_CFG['ms-place'].selected].some(p => ev.endsWith(' '+p))
    );
  } else {
    selEvs = EVENTS_LIST;
  }

  // 他のフィルター（市区町村・種類・公私・状況・検索）が効いている場合
  // → filteredに含まれる園名セットで絞る
  const hasOtherFilter = document.getElementById('q').value.trim() !== ''
    || MS_CFG['ms-city'].selected.size > 0
    || MS_CFG['ms-type'].selected.size > 0
    || MS_CFG['ms-pub'].selected.size > 0
    || MS_CFG['ms-status'].selected.size > 0;

  const filteredNames = hasOtherFilter ? new Set(filtered.map(d => d.園名)) : null;
  const inListNames = new Set(DATA.map(d => d.園名));

  const grid = document.getElementById('ev-card-grid'); grid.innerHTML='';
  let shownCards = 0;

  selEvs.forEach(ev => {
    const gardens = Object.entries(EVENTS_MAP[ev]||{})
      .filter(([name]) => filteredNames ? filteredNames.has(name) : true)
      .sort((a,b) => b[1]-a[1]);

    if (gardens.length === 0) return;
    shownCards++;

    const card = document.createElement('div'); card.className='ev-card';
    card.innerHTML = `
      <div class="ev-card-head">
        <h3>📅 ${escH(evShortLabel(ev))}</h3>
        <p>${gardens.length}園が配布 ／ 合計 ${gardens.reduce((s,[,c])=>s+c,0)} 枚</p>
      </div>
      <div class="ev-card-body">
        ${gardens.map(([name,cnt]) => `
          <div class="ev-garden-row">
            <span class="ev-garden-name">${escH(name)}${inListNames.has(name)?'<span class="ev-in-list">✓リスト内</span>':''}</span>
            <span class="ev-count-badge">${cnt}枚</span>
          </div>`).join('')}
      </div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('ev-result-count').textContent = shownCards;

  // ===== サマリーテーブル更新 =====
  const tbody = document.getElementById('ev-summary-tbody');
  tbody.innerHTML = '';
  let totalG = 0, totalC = 0;
  selEvs.forEach(ev => {
    const entries = Object.entries(EVENTS_MAP[ev]||{});
    const filtered_entries = entries.filter(([name]) => filteredNames ? filteredNames.has(name) : true);
    const gCount = filtered_entries.length;
    const cCount = filtered_entries.reduce((s,[,c])=>s+c, 0);
    if (gCount === 0) return;
    totalG += gCount; totalC += cCount;
    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid var(--border)';
    tr.innerHTML = `<td style="padding:8px 14px;">${escH(evShortLabel(ev))}</td>
      <td style="padding:8px 14px; text-align:right; font-weight:600;">${gCount}園</td>
      <td style="padding:8px 14px; text-align:right;">${cCount}枚</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('ev-summary-total-g').textContent = totalG + '園';
  document.getElementById('ev-summary-total-c').textContent = totalC + '枚';
}

// ===== ユーティリティ =====
function getBadgeType(t) {
  if (t==='保育所') return 'badge-hoiku';
  if (t.includes('幼保連携')) return 'badge-kodomo';
  if (t==='幼稚園') return 'badge-yochien';
  if (t==='認定こども園') return 'badge-kodomo2';
  if (t==='配布実績のみ' || t==='保育・幼稚施設') return 'badge-ev-only';
  if (t==='小規模・事業所内保育') return 'badge-small';
  return 'badge-kodomo2';
}
function updateStatus(id,el) {
  const d=DATA[id]; d._status=parseInt(el.value); el.className=`status-select ${STATUS_COLORS[d._status]}`; lsSave(d);
  if (MS_CFG['ms-status'].selected.size>0) onFilter();
}
function updateMemo(id,val) { const d=DATA[id]; d._memo=val; lsSave(d); }

function exportCSV() {
  const evHeaders = EVENTS_LIST.map(ev => evShortLabel(ev));
  const rows = [['#','園名','市区町村','種類','公私','住所','配布回数','配布合計枚数',...evHeaders,'アプローチ状況','メモ']];
  filtered.forEach((d,i) => {
    const evCounts = EVENTS_LIST.map(ev => d._ev[ev] !== undefined ? d._ev[ev] : '');
    rows.push([i+1,d.園名,d.市区町村,d.種類,d.私立公立,d.住所,d._ev_count,d._ev_total,...evCounts,STATUS_LABELS[d._status],d._memo]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`愛知県_保育園幼稚園リスト_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 初期化
buildListHeader();
document.getElementById('list-view').style.display = 'block';
document.getElementById('event-view').style.display = 'none';
onFilter();
</script>
