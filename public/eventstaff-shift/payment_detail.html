<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務委託 支払通知書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #f5f5f5; color: #1c1c1e; font-size: 14px; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 24px 20px 60px; }
  .invoice { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 40px; }
  .invoice-header { text-align: center; margin-bottom: 32px; border-bottom: 3px solid #1c1c1e; padding-bottom: 16px; }
  .invoice-title { font-size: 24px; font-weight: 700; letter-spacing: 0.15em; }
  .invoice-date { text-align: right; font-size: 13px; color: #666; margin-bottom: 28px; }
  .recipient { margin-bottom: 28px; }
  .recipient-name { font-size: 18px; font-weight: 500; border-bottom: 1px solid #1c1c1e; display: inline-block; padding-bottom: 4px; }
  .recipient-suffix { font-size: 14px; font-weight: 400; margin-left: 4px; }
  .recipient-detail { font-size: 13px; color: #555; line-height: 1.8; margin-top: 8px; }
  .section-label { font-size: 13px; font-weight: 500; color: #555; margin-bottom: 12px; letter-spacing: 0.05em; }
  .total-box { background: #f8f8f8; border: 1px solid #ddd; border-radius: 4px; padding: 16px 20px; margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; }
  .total-box-label { font-size: 14px; font-weight: 500; }
  .total-box-value { font-size: 24px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 24px; }
  thead th { background: #f0f0f0; padding: 8px 12px; font-weight: 500; font-size: 12px; color: #555; border-bottom: 2px solid #ccc; text-align: left; }
  thead th:last-child { text-align: right; }
  tbody td { padding: 8px 12px; border-bottom: 1px solid #e5e5e5; }
  tbody td:last-child { text-align: right; font-weight: 500; }
  tbody tr:last-child td { border-bottom: 1px solid #ccc; }
  tfoot td { padding: 10px 12px; font-weight: 500; }
  tfoot td:last-child { text-align: right; }
  .subtotal-row td { border-top: 1px solid #ccc; font-size: 13px; color: #555; }
  .total-row td { border-top: 2px solid #1c1c1e; font-size: 15px; font-weight: 700; }
  .issuer { margin-top: 40px; padding-top: 24px; border-top: 1px solid #ddd; }
  .issuer-label { font-size: 11px; color: #888; margin-bottom: 8px; font-weight: 500; letter-spacing: 0.1em; }
  .issuer-name { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .issuer-detail { font-size: 13px; color: #555; line-height: 1.8; }
  .btn { padding: 7px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #1c1c1e; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .btn-primary { background: #1a6bbf; color: #fff; border-color: #1a6bbf; }
  .error-box { background: #fff0ef; border: 1px solid #c0392b; border-radius: 8px; padding: 24px; margin-top: 40px; text-align: center; color: #c0392b; line-height: 1.8; }
  @media print {
    body { background: #fff; }
    .wrap { padding: 0; max-width: none; }
    .print-hide { display: none !important; }
    .invoice { border: none; padding: 20px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="wrap">
  <div id="pdf-actions" class="print-hide" style="display:none;margin-bottom:16px;text-align:right">
    <button class="btn btn-primary" onclick="downloadPDF()" id="pdfBtn">PDF ダウンロード</button>
  </div>
  <div id="root"></div>
</div>
<script>
var LZString=function(){var f=String.fromCharCode,keyStrUriSafe="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-$",baseReverseDic={};function getBaseValue(alphabet,character){if(!baseReverseDic[alphabet]){baseReverseDic[alphabet]={};for(var i=0;i<alphabet.length;i++)baseReverseDic[alphabet][alphabet.charAt(i)]=i}return baseReverseDic[alphabet][character]}function _decompress(length,resetValue,getNextValue){var dictionary=[],next,enlargeIn=4,dictSize=4,numBits=3,entry="",result=[],i,w,bits,resb,maxpower,power,c,data={val:getNextValue(0),position:resetValue,index:1};for(i=0;i<3;i+=1)dictionary[i]=i;bits=0;maxpower=Math.pow(2,2);power=1;while(power!=maxpower){resb=data.val&data.position;data.position>>=1;if(data.position==0){data.position=resetValue;data.val=getNextValue(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}switch(next=bits){case 0:bits=0;maxpower=Math.pow(2,8);power=1;while(power!=maxpower){resb=data.val&data.position;data.position>>=1;if(data.position==0){data.position=resetValue;data.val=getNextValue(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}c=f(bits);break;case 1:bits=0;maxpower=Math.pow(2,16);power=1;while(power!=maxpower){resb=data.val&data.position;data.position>>=1;if(data.position==0){data.position=resetValue;data.val=getNextValue(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}c=f(bits);break;case 2:return""}dictionary[3]=c;w=c;result.push(c);while(true){if(data.index>length)return"";bits=0;maxpower=Math.pow(2,numBits);power=1;while(power!=maxpower){resb=data.val&data.position;data.position>>=1;if(data.position==0){data.position=resetValue;data.val=getNextValue(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}switch(c=bits){case 0:bits=0;maxpower=Math.pow(2,8);power=1;while(power!=maxpower){resb=data.val&data.position;data.position>>=1;if(data.position==0){data.position=resetValue;data.val=getNextValue(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}dictionary[dictSize++]=f(bits);c=dictSize-1;enlargeIn--;break;case 1:bits=0;maxpower=Math.pow(2,16);power=1;while(power!=maxpower){resb=data.val&data.position;data.position>>=1;if(data.position==0){data.position=resetValue;data.val=getNextValue(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}dictionary[dictSize++]=f(bits);c=dictSize-1;enlargeIn--;break;case 2:return result.join("")}if(enlargeIn==0){enlargeIn=Math.pow(2,numBits);numBits++}if(dictionary[c]){entry=dictionary[c]}else{if(c===dictSize){entry=w+w.charAt(0)}else{return null}}result.push(entry);dictionary[dictSize++]=w+entry.charAt(0);enlargeIn--;if(enlargeIn==0){enlargeIn=Math.pow(2,numBits);numBits++}w=entry}}return{decompressFromEncodedURIComponent:function(input){if(input==null)return"";if(input=="")return null;input=input.replace(/ /g,"+");return _decompress(input.length,32,function(index){return getBaseValue(keyStrUriSafe,input.charAt(index))})}}}();

function render() {
  var root = document.getElementById('root');
  var params = new URLSearchParams(location.search);
  var compressed = params.get('z');
  var encoded = params.get('d');

  if (!compressed && !encoded) {
    root.innerHTML = '<div class="error-box">URLが正しくありません。<br>支払い管理ページからURLをコピーして開いてください。</div>';
    return;
  }

  var data;
  try {
    if (compressed) {
      var decompressed = LZString.decompressFromEncodedURIComponent(compressed);
      if (!decompressed) throw new Error('decompression failed');
      data = JSON.parse(decompressed);
    } else {
      data = JSON.parse(decodeURIComponent(escape(atob(encoded))));
    }
  } catch(e) {
    root.innerHTML = '<div class="error-box">データの読み込みに失敗しました。<br>支払い管理ページから最新のURLを取得してください。</div>';
    return;
  }

  var m = (data.ms && data.ms.length) ? data.ms[0] : null;
  var parts = m ? m.mo.split('-') : [];
  var monthLabel = m ? parts[0] + '\u5e74' + parseInt(parts[1]) + '\u6708' : '';

  document.title = '\u696d\u52d9\u59d4\u8a17 \u652f\u6255\u901a\u77e5\u66f8 - ' + data.n + ' - ' + monthLabel;
  window._pdfData = data;
  document.getElementById('pdf-actions').style.display = 'block';

  // Build line items
  var rows = '';
  var subtotalPay = 0;
  if (m) {
    m.ev.forEach(function(e) {
      var desc = [e.v, e.ct].filter(Boolean).join(' / ');
      subtotalPay += e.p;
      rows += '<tr><td style="white-space:nowrap">' + e.dt + '</td>'
        + '<td>' + desc + '</td>'
        + '<td style="text-align:right;font-weight:500">\uffe5' + e.p.toLocaleString() + '</td></tr>';
      if (e.ex && e.ex.length) {
        e.ex.forEach(function(x) {
          subtotalPay += x.am;
          rows += '<tr><td></td><td style="font-size:12px;color:#666">\u2514 ' + x.lb + '</td>'
            + '<td style="text-align:right;font-weight:500">\uffe5' + x.am.toLocaleString() + '</td></tr>';
        });
      }
    });
    (m.prep || []).forEach(function(pw) {
      subtotalPay += pw.p;
      rows += '<tr><td style="white-space:nowrap">' + pw.dt + '</td>'
        + '<td style="color:#5856d6">' + pw.desc + '</td>'
        + '<td style="text-align:right;font-weight:500;color:#5856d6">\uffe5' + pw.p.toLocaleString() + '</td></tr>';
    });
  }

  var transport = m ? m.tr : 0;
  var grandTotal = subtotalPay + transport;

  var today = new Date();
  var todayStr = today.getFullYear() + '\u5e74' + (today.getMonth()+1) + '\u6708' + today.getDate() + '\u65e5';

  var html = '<div class="invoice">'
    + '<div class="invoice-header"><div class="invoice-title">\u696d\u52d9\u59d4\u8a17\u3000\u652f\u6255\u901a\u77e5\u66f8</div></div>'
    + '<div class="invoice-date">\u767a\u884c\u65e5: ' + todayStr + '</div>'

    // 宛先（スタッフ）
    + '<div class="recipient">'
    + '<div class="recipient-name">' + data.n + '<span class="recipient-suffix">\u69d8</span></div>'
    + '<div class="recipient-detail">'
    + (data.addr ? '\u4f4f\u6240: ' + data.addr + '<br>' : '')
    + (data.phone ? '\u96fb\u8a71\u756a\u53f7: ' + data.phone : '')
    + '</div>'
    + '</div>'

    // 支払い内容
    + '<div class="section-label">\u652f\u6255\u3044\u5185\u5bb9\uff08' + monthLabel + '\uff09</div>'
    + '<div class="total-box">'
    + '<div class="total-box-label">\u652f\u6255\u91d1\u984d</div>'
    + '<div class="total-box-value">\uffe5' + grandTotal.toLocaleString() + '</div>'
    + '</div>'
    + '<table>'
    + '<thead><tr><th>\u65e5\u4ed8</th><th>\u5185\u5bb9</th><th style="text-align:right">\u91d1\u984d</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '<tfoot>'
    + '<tr class="subtotal-row"><td colspan="2" style="text-align:right">\u5c0f\u8a08</td><td style="text-align:right">\uffe5' + subtotalPay.toLocaleString() + '</td></tr>'
    + '<tr class="subtotal-row"><td colspan="2" style="text-align:right">\u4ea4\u901a\u8cbb' + (m && m.d ? '\uff08' + m.d + 'km\uff09' : '') + (m && m.trd > 0 ? '<div style="font-size:10px;color:#888;margin-top:2px">\u203b\u516c\u5171\u4ea4\u901a\u6a5f\u95a2\u3067\u306e\u8cbb\u7528\u5dee\u984d\u5206\uff08+\uffe5' + m.trd.toLocaleString() + '\uff09\u3092\u542b\u3080</div>' : '') + '</td><td style="text-align:right">\uffe5' + transport.toLocaleString() + '</td></tr>'
    + '<tr class="total-row"><td colspan="2" style="text-align:right">\u5408\u8a08</td><td style="text-align:right">\uffe5' + grandTotal.toLocaleString() + '</td></tr>'
    + '</tfoot>'
    + '</table>'

    // 備考（内容詳細）
    + (function() {
      var isLeader = m && m.ev.some(function(e) { return e.rl === 'leader'; });
      if (isLeader) {
        return '<div style="margin-top:8px;padding:16px 20px;background:#fafafa;border:1px solid #e5e5e5;border-radius:4px">'
          + '<div style="font-size:12px;font-weight:500;color:#555;margin-bottom:8px">\u5185\u5bb9\u8a73\u7d30</div>'
          + '<ul style="font-size:13px;color:#333;line-height:2;padding-left:20px;margin:0">'
          + '<li>\u30de\u30cb\u30e5\u30a2\u30eb\u3092\u53c2\u8003\u3068\u3057\u305f\u3001\u77e5\u898b\u3068\u7d4c\u9a13\u3092\u6d3b\u304b\u3057\u305f\u30a4\u30d9\u30f3\u30c8\u306e\u904b\u55b6</li>'
          + '<li>\u696d\u52d9\u7d42\u4e86\u5f8c\u306e\u5831\u544a\uff08\u826f\u304b\u3063\u305f\u70b9\u3001\u6539\u5584\u70b9\u3001\u30de\u30cb\u30e5\u30a2\u30eb\u6539\u5584\u306e\u52a9\u8a00\u7b49\uff09</li>'
          + '<li>\u5404\u7a2e\u5171\u6709\uff08\u632f\u308a\u8fd4\u308a\u3001\u30a2\u30f3\u30b1\u30fc\u30c8\u3001\u64ae\u5f71\u30c7\u30fc\u30bf\u7b49\uff09</li>'
          + '<li>\u30de\u30cb\u30e5\u30a2\u30eb\u306e\u4fee\u6b63</li>'
          + '</ul></div>';
      } else {
        return '<div style="margin-top:8px;padding:16px 20px;background:#fafafa;border:1px solid #e5e5e5;border-radius:4px">'
          + '<div style="font-size:12px;font-weight:500;color:#555;margin-bottom:8px">\u5185\u5bb9\u8a73\u7d30</div>'
          + '<ul style="font-size:13px;color:#333;line-height:2;padding-left:20px;margin:0">'
          + '<li>\u30de\u30cb\u30e5\u30a2\u30eb\u3092\u53c2\u8003\u3068\u3057\u305f\u3001\u77e5\u898b\u3068\u7d4c\u9a13\u3092\u6d3b\u304b\u3057\u305f\u30a4\u30d9\u30f3\u30c8\u306e\u904b\u55b6</li>'
          + '<li>\u696d\u52d9\u7d42\u4e86\u5f8c\u306e\u5831\u544a\uff08\u826f\u304b\u3063\u305f\u70b9\u3001\u6539\u5584\u70b9\u3001\u30de\u30cb\u30e5\u30a2\u30eb\u6539\u5584\u306e\u52a9\u8a00\u7b49\uff09</li>'
          + '</ul></div>';
      }
    })()

    // 支払元
    + '<div class="issuer">'
    + '<div class="issuer-label">\u652f\u6255\u5143</div>'
    + '<div class="issuer-name">Lawin\u682a\u5f0f\u4f1a\u793e</div>'
    + '<div class="issuer-detail">'
    + '\u3012470-0156<br>'
    + '\u611b\u77e5\u770c\u611b\u77e5\u90e1\u6771\u90f7\u753a\u5fa1\u5cb3\u4e8c\u4e01\u76ee\uff11\u756a\u5730\uff11'
    + '</div>'
    + '</div>'

    + '</div>';

  root.innerHTML = html;
}
render();

function downloadPDF() {
  var btn = document.getElementById('pdfBtn');
  btn.textContent = '\u751f\u6210\u4e2d\u2026';
  btn.disabled = true;
  var el = document.getElementById('root');
  var name = window._pdfData ? window._pdfData.n : 'staff';
  var m = window._pdfData && window._pdfData.ms && window._pdfData.ms[0];
  var monthStr = m ? m.mo.replace('-','') : '';
  var filename = '\u652f\u6255\u901a\u77e5\u66f8_' + name + '_' + monthStr + '.pdf';
  var opt = {
    margin: [10, 10, 10, 10],
    filename: filename,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
  };
  html2pdf().set(opt).from(el).save().then(function() {
    btn.textContent = 'PDF \u30c0\u30a6\u30f3\u30ed\u30fc\u30c9';
    btn.disabled = false;
  }).catch(function() {
    btn.textContent = 'PDF \u30c0\u30a6\u30f3\u30ed\u30fc\u30c9';
    btn.disabled = false;
    alert('PDF\u751f\u6210\u306b\u5931\u6557\u3057\u307e\u3057\u305f\u3002');
  });
}
</script>
</body>
</html>
