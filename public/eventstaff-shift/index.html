    setupAddressField('f_vaddrSearch', null, null, 'vCoordField');
  }, 50);
}

function saveVenue(id) {
  const name=document.getElementById('f_vname').value.trim();
  if(!name){alert('会場名を入力');return;}
  const vs=load(SK.venues,[]);
  const data={name,shortName:document.getElementById('f_vshort').value.trim(),address:document.getElementById('f_vaddrSearch').value.trim(),lat:parseFloat(document.getElementById('f_vlat').value)||null,lng:parseFloat(document.getElementById('f_vlng').value)||null};
  if(id){ invalidateDistForVenue(id); Object.assign(vs.find(x=>x.id===id),data); }
  else{ const newId=(vs.length?Math.max(...vs.map(x=>x.id)):0)+1; vs.push({id:newId,...data}); }
  save(SK.venues,vs);
  closeModal();
  renderPage();
  if (window._afterVenueSave) {
    const cb = window._afterVenueSave;
    window._afterVenueSave = null;
    setTimeout(cb, 50);
  }
}
function deleteVenue(id){
  if(!confirm('削除しますか？'))return;
  save(SK.venues,load(SK.venues,[]).filter(x=>x.id!==id)); renderPage();
}

        <div class="form-group" style="margin:0"><label class="form-label">事前準備（h）</label>
          <input type="number" class="form-control" id="cew_study" value="${c.studyHours||0}" min="0" step="0.5"></div>
        <div class="form-group" style="margin:0"><label class="form-label">休憩（分）</label>
          <input type="number" class="form-control" id="cew_break" value="${c.opBreak||0}" min="0"></div>
        <div class="form-group" style="margin:0"><label class="form-label">開始時刻</label>
          <input type="time" class="form-control" id="cew_start" value="${c.opStart||''}"></div>
        <div class="form-group" style="margin:0"><label class="form-label">終了時刻</label>
          <input type="time" class="form-control" id="cew_end" value="${c.opEnd||''}"></div>
      </div>

      <div style="font-size:11px;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">ランク別日給</div>
      ${rankInputs}
      <div style="background:#f0faf4;border-radius:var(--radius-sm);padding:10px 12px;border:1px solid #a3d9b1;margin-top:8px">
        <div style="font-size:11px;font-weight:500;color:var(--green-dark);margin-bottom:8px">🔧 ロジ担当（追加加算）</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;color:var(--ink-mid)">ランク日給＋</span>
          <input type="number" class="form-control" style="width:110px" id="cew_logi_wage" value="${c.logiWage||0}" min="0">
          <span style="font-size:12px;color:var(--ink-soft)">円/日</span>
        </div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:4px">搬入搬出・車両誘導などロジ業務を担当する場合の追加金額</div>
      </div>

      <hr style="margin:12px 0;border:none;border-top:1px solid var(--surface-3)">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
          <div class="form-group" style="margin:0"><label class="form-label">事前準備（h）</label>
            <input type="number" class="form-control" id="cew_ldr_study" value="${c.ldrStudyHours!=null?c.ldrStudyHours:c.studyHours||0}" min="0" step="0.5"></div>
          <div class="form-group" style="margin:0"><label class="form-label">休憩（分）</label>
            <input type="number" class="form-control" id="cew_ldr_break" value="${c.ldrOpBreak!=null?c.ldrOpBreak:c.opBreak||0}" min="0"></div>
          <div class="form-group" style="margin:0"><label class="form-label">開始時刻</label>
            <input type="time" class="form-control" id="cew_ldr_start" value="${c.ldrOpStart||c.opStart||''}"></div>
          <div class="form-group" style="margin:0"><label class="form-label">終了時刻</label>
            <input type="time" class="form-control" id="cew_ldr_end" value="${c.ldrOpEnd||c.opEnd||''}"></div>
        </div>
        <div class="form-group" style="margin:0"><label class="form-label">リーダー日給（円/日）</label>

      <button class="btn btn-primary" onclick="saveCatEditModal(${catId})">保存</button>

function saveCatEditModal(catId) {
  const cats  = load(SK.cats,[]);
  const ranks = load(SK.ranks,[]);
  const c = cats.find(x=>x.id===catId);
  if (!c) return;

  c.studyHours    = parseFloat(document.getElementById('cew_study').value)    || 0;
  c.opBreak       = parseInt(document.getElementById('cew_break').value)       || 0;
  c.opStart       = document.getElementById('cew_start').value;
  c.opEnd         = document.getElementById('cew_end').value;
  c.ldrStudyHours = parseFloat(document.getElementById('cew_ldr_study').value) || 0;
  c.ldrOpBreak    = parseInt(document.getElementById('cew_ldr_break').value)   || 0;
  c.ldrOpStart    = document.getElementById('cew_ldr_start').value;
  c.ldrOpEnd      = document.getElementById('cew_ldr_end').value;
  c.leaderDailyWage = parseInt(document.getElementById('cew_ldr_wage').value)  || 0;
  c.logiWage        = parseInt(document.getElementById('cew_logi_wage').value) || 0;

  if (!c.rankWages) c.rankWages = {};
  ranks.forEach(r => {
    const val = parseInt(document.getElementById(`cew_rank_${r.id}`)?.value) || 0;
    c.rankWages[r.id]         = val;
    c.rankWages[String(r.id)] = val;
  });

  save(SK.cats, cats);
  closeModal();
  renderPage();
}

// =====================================================
// MODALS - CATEGORY
// =====================================================
function openCatModal(id) {
  const c=id?load(SK.cats,[]).find(x=>x.id===id):null;
  const colors=['badge-green','badge-purple','badge-amber','badge-blue','badge-red','badge-gray'];
  const colorLabels = {'badge-green':'緑','badge-purple':'紫','badge-amber':'オレンジ','badge-blue':'青','badge-red':'赤','badge-gray':'グレー'};
  openModal(`<div class="modal" style="max-width:520px">
    <div class="modal-header"><h3>${c?'カテゴリー編集':'カテゴリー追加'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">カテゴリー名<span class="req">*</span></label><input type="text" class="form-control" id="f_cname" placeholder="例：マルシェ" value="${c?.name||''}"></div>
      <div class="form-group"><label class="form-label">バッジカラー</label>
        <select class="form-control" id="f_cc">${colors.map(cl=>`<option value="${cl}" ${c?.color===cl?'selected':''}>${colorLabels[cl]||cl}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="form-label">デフォルト必要人数</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="number" class="form-control" id="f_creq" style="width:100px" value="${c?.defaultRequiredCount||3}" min="1">
          <span style="font-size:13px;color:var(--ink-soft)">名</span>
        </div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:4px">イベント登録時にカテゴリーを選ぶと自動でセットされます</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveCat(${id||'null'})">保存</button>
    </div>
  </div>`);
}

function saveCat(id) {
  const name=document.getElementById('f_cname').value.trim();
  if(!name){alert('名前を入力');return;}
  const cs=load(SK.cats,[]);
  const ranks=load(SK.ranks,[]);
  const defaultRequiredCount=parseInt(document.getElementById('f_creq')?.value)||3;
  const data={name,color:document.getElementById('f_cc').value,defaultRequiredCount};
  if(id){
    Object.assign(cs.find(x=>x.id===id),data);
  } else {
    const newId=(cs.length?Math.max(...cs.map(x=>x.id)):0)+1;
    const rankWages={};
    ranks.forEach(r=>{ rankWages[r.id]=0; });
    cs.push({id:newId,...data,
      studyHours:1, opStart:'10:00', opEnd:'17:00', opBreak:0,
      rankWages, leaderDailyWage:0,
      ldrStudyHours:1, ldrOpStart:'10:00', ldrOpEnd:'17:00', ldrOpBreak:0
    });
  }
  save(SK.cats,cs); closeModal(); renderPage();
}
function deleteCat(id){
  if(!confirm('削除しますか？'))return;
  save(SK.cats,load(SK.cats,[]).filter(x=>x.id!==id)); renderPage();
}

// =====================================================
// STAFFING ACTIONS
// =====================================================
function updateEv(id, field, val) {
  const evs=load(SK.events,[]), ev=evs.find(e=>e.id===id);
  if(ev) ev[field]=val;
  save(SK.events,evs);
}
function changeRequired(id){
  const evs=load(SK.events,[]),ev=evs.find(e=>e.id===id);
  const v=prompt('必要人数:',ev.requiredCount);
  if(v!==null){const n=parseInt(v);if(!isNaN(n)&&n>0){ev.requiredCount=n;save(SK.events,evs);}}
  renderPage();
}
function cycleAtt(evId, staffId){
  const evs=load(SK.events,[]),ev=evs.find(e=>e.id===evId);
  const cycle={ok:'ng',ng:'unknown',unknown:'ok',unsure:'ok'};
  ev.attendance[staffId]=cycle[ev.attendance[staffId]||'unknown'];
  save(SK.events,evs); renderPage();
}
function toggleCand(evId,staffId){
  const evs=load(SK.events,[]),ev=evs.find(e=>e.id===evId);
  const idx=ev.staffAssignments.findIndex(a=>a.staffId===staffId);
  if(idx>=0)ev.staffAssignments.splice(idx,1);
  else ev.staffAssignments.push({staffId,status:'candidate',isLeader:false});
  save(SK.events,evs); renderPage();
}
function toggleConf(evId,staffId){
  const evs=load(SK.events,[]),ev=evs.find(e=>e.id===evId);
  const a=ev.staffAssignments.find(x=>x.staffId===staffId);
  if(a)a.status=a.status==='confirmed'?'candidate':'confirmed';
  save(SK.events,evs); renderPage();
}
function toggleLeader(evId,staffId){
  const evs=load(SK.events,[]),ev=evs.find(e=>e.id===evId);
  const a=ev.staffAssignments.find(x=>x.staffId===staffId);
  if(a)a.isLeader=!a.isLeader;
  save(SK.events,evs); renderPage();
}
function toggleWorked(evId,staffId){
  const evs=load(SK.events,[]),ev=evs.find(e=>e.id===evId);
  const a=ev.staffAssignments.find(x=>x.staffId===staffId);
  if(a)a.status=a.status==='worked'?'confirmed':'worked';
  save(SK.events,evs); renderPage();
}

// INIT
// =====================================================
initMaps();
renderSidebar();
renderPage();

// GAS同期：初回ロード＆20秒ポーリング
fetchFromGAS();
setInterval(fetchFromGAS, 20000);
