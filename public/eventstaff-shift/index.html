    if (!v?.lat) return;
    e.staffAssignments.filter(a => a.status === 'worked').forEach(a => {
      const s = staffs.find(x => x.id === a.staffId);
      if (!s?.lat || isNaN(parseFloat(s.lat)) || isNaN(parseFloat(s.lng))) return;
      const k = `${s.id}:${v.id}`;
      if (!seen.has(k) && cache[k] === undefined) { seen.add(k); uncached.push({staff:s, venue:v}); }
    });
  });
  // 未キャッシュがある場合はローディング画面を表示して取得
  if (uncached.length > 0 && localStorage.getItem(SK.apikey) && !_distPrefetching) {
    _distPrefetching = true;
    content.innerHTML = `<div style="padding:48px;text-align:center;color:var(--ink-soft)">
      <div style="font-size:28px;margin-bottom:12px">🗺</div>
      <div style="font-size:14px">道路距離を取得中... (${uncached.length}件)</div>
      <div style="font-size:11px;margin-top:6px">初回のみ時間がかかります</div>
    </div>`;
    window._distMatrixError = null;
    const _markRemainingNull = () => {
      // まだキャッシュされていないペアをnullに（再ループ防止）
      const c = _distCache();
      uncached.forEach(({staff, venue}) => {
        if (!((`${staff.id}:${venue.id}`) in c)) c[`${staff.id}:${venue.id}`] = null;
      });
      _saveDistCache(c);
    };
    // タイムアウト：30秒経ったら強制描画（バックグラウンド取得は継続）
    const _timeoutId = setTimeout(() => {
      if (!_distPrefetching) return;
      _distPrefetching = false;
      _markRemainingNull();
      renderPage();
    }, 30000);
    prefetchDistances(uncached).then(() => {
      if (!_distPrefetching) return; // タイムアウト済みなら何もしない
      clearTimeout(_timeoutId);
      _distPrefetching = false;
      if (window._distMatrixError) showToast(`道路距離取得エラー (${window._distMatrixError})`, false);
      renderPage();
    }).catch(() => {
      clearTimeout(_timeoutId);
      _distPrefetching = false;
      _markRemainingNull();
      renderPage();
    });
    return;
  }

  const tabs = [
    { id:'combined', label:'スタッフ × 月別' },
    { id:'event',    label:'イベント別' },
    { id:'billing',  label:'請求管理' },
  ];

  let body = '';

  // ══════════════════════════════════════════
  // スタッフ × 月別：マトリクス表 ＋ 選択スタッフの詳細
  // ══════════════════════════════════════════
  if (activeTab === 'combined') {
    if (!paymentSelectedStaff && staffs.length) paymentSelectedStaff = staffs[0].id;

    // 稼働実績のある月を抽出
    const months = [...new Set(
      events.filter(e=>e.staffAssignments.some(a=>a.status==='worked'))
            .map(e=>e.date.slice(0,7))
    )].sort();

    // マトリクス計算: month → staffId → { pay, trans, total, count }
    const matrix = {};
    const staffTotals = {};
    const monthTotals = {};
    let grandTotal = 0;
    const allExtras = load(SK.extraCosts, {});
    const allPrepWorkAll = load(SK.prepWork, []);
    staffs.forEach(s => { staffTotals[s.id] = 0; });

    // 事前準備作業がある月も含める
    allPrepWorkAll.forEach(pw => {
      const m = pw.date.slice(0,7);
      if (!months.includes(m)) months.push(m);
    });
    months.sort();

    months.forEach(m => {
      monthTotals[m] = 0;
      matrix[m] = {};
      staffs.forEach(s => {
        // スナップショットがあればそれを使う（confirmed/paid月）
        const snap = getMonthSnapshot(s.id, m);
        if (snap) {
          const cnt = (snap.events||[]).length + (snap.prepWork||[]).length;
          // 振込済みの場合、paid_amountsを権威ある合計として使う
          const pst = (load(SK.payStatus,{})[`${s.id}:${m}`]) || 'pending';
          const pa = pst === 'paid' ? load('staff_mgmt_paid_amounts',{})[`${s.id}:${m}`] : null;
          const useTotal = (pa != null) ? pa : snap.total;
          matrix[m][s.id] = { pay: snap.pay, trans: snap.transport, extra: snap.extra||0, prep: snap.prep||0, total: useTotal, count: cnt };
          staffTotals[s.id] += useTotal;
          monthTotals[m]    += useTotal;
          grandTotal        += useTotal;
          return;
        }
        const wevs = events.filter(e=>
          e.date.startsWith(m) &&
          e.staffAssignments.some(a=>a.staffId===s.id&&a.status==='worked')
        );
        const prepItems = allPrepWorkAll.filter(pw => pw.staffId === s.id && pw.date.startsWith(m));
        let mPrep = prepItems.reduce((sum, pw) => sum + Math.floor((pw.hours||0) * (pw.hourlyRate||0)), 0);
        if (!wevs.length && !prepItems.length) { matrix[m][s.id] = null; return; }
        let mPay = 0, mDist = 0, mExtra = 0;
        wevs.forEach(e => {
          const v = venues.find(x=>x.id===e.venueId);
          mPay  += calcPay(e, s.id).total;
          const d = getRoadDistKm(s, v);
          if (d !== null) mDist += d * 2;
          const extras = allExtras[`${s.id}:${e.id}`] || [];
          mExtra += extras.reduce((sum, x) => sum + (x.amount||0), 0);
        });
        const trans  = getMonthTransport(s.id, m, mDist);
        const mTotal = mPay + trans + mExtra + mPrep;
        matrix[m][s.id] = { pay: mPay, trans, extra: mExtra, prep: mPrep, total: mTotal, count: wevs.length + prepItems.length };
        staffTotals[s.id] += mTotal;
        monthTotals[m]    += mTotal;
        grandTotal        += mTotal;
      });
    });

    // マトリクス表 HTML
    const headerCells = staffs.map(s => {
      const active = paymentSelectedStaff === s.id;
      return `<th style="text-align:center;padding:8px 10px;font-size:12px;white-space:nowrap;cursor:pointer;
                         color:${active?'var(--accent)':'var(--ink)'};background:${active?'var(--accent-light)':'var(--surface-2)'}"
              onclick="paymentSelectedStaff=${s.id};_openPayMonths.clear();renderPage()">${s.name}</th>`;
    }).join('');

    const matrixRows = months.map(m => {
      const [yr, mo] = m.split('-');
      const label = `${yr}年${parseInt(mo)}月`;
      const cells = staffs.map(s => {
        const cell = matrix[m]?.[s.id];
        const active = paymentSelectedStaff === s.id;
        const bg = active ? 'var(--accent-light)' : 'var(--surface)';
        const pst = (load(SK.payStatus,{})[`${s.id}:${m}`]) || 'pending';
        const paidAmt = load('staff_mgmt_paid_amounts',{})[`${s.id}:${m}`];
        const diff = pst==='paid' && cell && paidAmt != null ? Math.max(0, cell.total - paidAmt) : 0;
        if (!cell) return `<td style="text-align:center;color:var(--ink-faint);padding:8px 10px;background:${bg};font-size:12px;cursor:pointer"
                              onclick="paymentSelectedStaff=${s.id};_openPayMonths.clear();renderPage()">－</td>`;
        return `<td style="text-align:center;padding:6px 10px;background:${bg};font-size:12px">
          <div style="cursor:pointer" onclick="paymentSelectedStaff=${s.id};_openPayMonths.clear();renderPage()">
            <div style="font-weight:500">¥${cell.total.toLocaleString()}</div>
            <div style="font-size:10px;color:var(--ink-soft)">${cell.count}件${cell.prep ? ' <span style="color:var(--purple)">+準備</span>' : ''}</div>
          </div>
          <div onclick="event.stopPropagation();cyclePayStatus(${s.id},'${m}');renderPage()" style="cursor:pointer;user-select:none">${payStatusBadge(pst, diff)}</div>
        </td>`;
      }).join('');
      return `<tr style="border-bottom:1px solid var(--surface-3)">
        <td style="padding:8px 12px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);position:sticky;left:0;z-index:1">${label}</td>
        ${cells}
        <td style="text-align:right;padding:8px 12px;font-size:12px;font-weight:500;background:var(--surface-2);white-space:nowrap">¥${monthTotals[m].toLocaleString()}</td>
      </tr>`;
    }).join('');

    const totalCells = staffs.map(s =>
      `<td style="text-align:center;padding:8px 10px;font-size:12px;font-weight:500;color:var(--accent)">¥${(staffTotals[s.id]||0).toLocaleString()}</td>`
    ).join('');

    const matrixHtml = months.length === 0 ? '' : `
      <div class="card" style="margin-bottom:16px;overflow:auto;max-height:60vh;position:relative">
        <table style="width:100%;border-collapse:collapse">
          <thead style="position:sticky;top:0;z-index:2">
            <tr><th style="padding:8px 12px;font-size:12px;text-align:left;background:var(--surface-2);position:sticky;left:0;z-index:3">月</th>
              ${headerCells}
              <th style="padding:8px 12px;font-size:12px;text-align:right;background:var(--surface-2)">月計</th>
            </tr>
          </thead>
          <tbody>${matrixRows}</tbody>
          <tfoot style="position:sticky;bottom:0;z-index:2">
            <tr style="background:var(--accent-light)">
              <td style="padding:8px 12px;font-size:12px;font-weight:500;position:sticky;left:0;background:var(--accent-light);z-index:3">累計</td>
              ${totalCells}
              <td style="text-align:right;padding:8px 12px;font-size:13px;font-weight:500;color:var(--accent)">¥${grandTotal.toLocaleString()}</td>
            </tr>
          </tfoot>
        </table>
      </div>`;

    // 選択スタッフの詳細（月別イベント一覧）
    let detailHtml = '';
    const sel = staffs.find(s=>s.id===paymentSelectedStaff);
    if (sel) {
      const rank = ranks.find(r=>r.id===sel.rankId);
      const wevs = events
        .filter(e=>e.staffAssignments.some(a=>a.staffId===sel.id&&a.status==='worked'))
        .slice().sort((a,b)=>a.date.localeCompare(b.date));
      const byMonth = {};
      wevs.forEach(e => {
        const m = e.date.slice(0,7);
        if (!byMonth[m]) byMonth[m] = [];
        byMonth[m].push(e);
      });
      // 事前準備作業を月別に統合
      const allPrepWork = load(SK.prepWork, []).filter(pw => pw.staffId === sel.id);
      allPrepWork.forEach(pw => {
        const m = pw.date.slice(0,7);
        if (!byMonth[m]) byMonth[m] = [];
      });

      const currentMonth = new Date().toISOString().slice(0,7);
      // 初回: 今月以降をデフォルトで開く
      if (_openPayMonths.size === 0) {
        Object.keys(byMonth).forEach(m => { if (m >= currentMonth) _openPayMonths.add(m); });
      }
      let grandPay = 0, grandTransport = 0, grandExtra = 0, grandPrep = 0;
      const monthBlocks = Object.entries(byMonth).sort().map(([month, mes]) => {
        // スナップショットがあればそれを使う（confirmed/paid月）
        const snap = getMonthSnapshot(sel.id, month);
        let mPay, mDist, mExtra, mPrep, mTransport, rows, prepRows, calcedTransport, isCustomTransport, customTransportNote, customTransportEntry;
        if (snap) {
          // スナップショットからデータを表示（読み取り専用）
          mPay = snap.pay; mDist = snap.dist; mExtra = snap.extra||0; mPrep = snap.prep||0;
          mTransport = snap.transport;
          calcedTransport = transportAmt(mDist, month);
          customTransportEntry = getCustomTransportEntry(sel.id, month);
          isCustomTransport = customTransportEntry != null;
          customTransportNote = isCustomTransport ? (customTransportEntry.note || '') : '';
          rows = (snap.events||[]).map(ev => {
            const roleBadge = ev.rl==='leader' ? '<span class="badge badge-purple" style="font-size:10px">リーダー</span>' : '';
            const timeCell = `${(ev.o||0).toFixed(1)}h${ev.s?'+'+ev.s+'h':''}`;
            const extraLabels = (ev.ex||[]).map(x => `<div style="font-size:10px;color:var(--purple)">+¥${x.am.toLocaleString()} ${x.lb||''}</div>`).join('');
            const payCell = ev.p===0 ? '⚠ 未設定' : `¥${ev.p.toLocaleString()}${extraLabels}`;
            return `<tr>
              <td style="white-space:nowrap;font-weight:500">${ev.dt}</td>
              <td style="font-size:12px;color:var(--ink-soft);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ev.v||'-'}</td>
              <td><span class="badge ${ev.cc||'badge-gray'}" style="font-size:10px">${ev.c||''}</span></td>
              <td style="font-size:12px;text-align:center">${timeCell}</td>
              <td style="text-align:center">${roleBadge}</td>
              <td style="text-align:right;color:var(--ink-soft)">-</td>
              <td style="text-align:right;font-weight:500">${payCell}</td>
            </tr>`;
          }).join('');
          prepRows = (snap.prepWork||[]).map(pw => {
            return `<tr style="background:var(--purple-light)">
              <td style="white-space:nowrap;font-weight:500">${pw.dt}</td>
              <td colspan="2" style="font-size:12px;color:var(--purple)">${pw.desc || '事前準備'}</td>
              <td style="font-size:12px;text-align:center">${Math.floor(pw.h)}h${Math.round((pw.h%1)*60) ? Math.round((pw.h%1)*60)+'m' : ''}</td>
              <td style="text-align:center"><span class="badge badge-purple" style="font-size:10px">準備</span></td>
              <td style="text-align:right;font-size:11px;color:var(--ink-soft)">@¥${(pw.rate||0).toLocaleString()}</td>
              <td style="text-align:right;font-weight:500;color:var(--purple)">¥${pw.p.toLocaleString()}</td>
            </tr>`;
          }).join('');
        } else {
          // ライブ計算
          mPay = 0; mDist = 0; mExtra = 0;
          let mDistOneWay = 0;
          const allExtras = load(SK.extraCosts, {});
          rows = mes.map(e => {
            const v = venues.find(x=>x.id===e.venueId);
            const c = cats.find(x=>x.id===e.categoryId);
            const a = e.staffAssignments.find(x=>x.staffId===sel.id);
            const p = calcPay(e, sel.id);
            const dist = getRoadDistKm(sel, v);
            const h = calcEventHours(e);
            const extraKey = `${sel.id}:${e.id}`;
            const extras = allExtras[extraKey] || [];
            const extraTotal = extras.reduce((s,x) => s + (x.amount||0), 0);
            mPay += p.total; mExtra += extraTotal; if (dist !== null) { mDistOneWay += dist; mDist += dist * 2; }
            const roleBadges = [
              a?.isLeader ? '<span class="badge badge-purple" style="font-size:10px">リーダー</span>' : '',
              a?.isLogi   ? '<span class="badge badge-green"  style="font-size:10px">🔧ロジ</span>'   : '',
            ].filter(Boolean).join(' ');
            const displayStudy = a?.customStudyHours != null ? a.customStudyHours : (a?.isLeader ? (e.ldrStudyHours ?? h.studyHours) : h.studyHours);
            const displayOp = a?.customOpHours != null ? a.customOpHours : h.opHours;
            const isCustomTime = a?.customOpHours != null || a?.customStudyHours != null;
            const timeCell = `<span onclick="event.stopPropagation();openStaffTimeModal(${sel.id},${e.id})" style="cursor:pointer;border-bottom:1px dashed ${isCustomTime?'var(--accent)':'var(--ink-faint)'};color:${isCustomTime?'var(--accent)':'inherit'}" title="クリックで時間を編集">${displayOp.toFixed(1)}h${displayStudy?'+'+displayStudy+'h':''}</span>${isCustomTime?'<div style="font-size:9px;color:var(--accent)">個別</div>':''}`;
            const extraLabels = extras.map(x => `<div style="font-size:10px;color:var(--purple)">+¥${x.amount.toLocaleString()} ${x.label||''}</div>`).join('');
            const payCell = p.total===0 && extraTotal===0 ? '⚠ 未設定'
              : `¥${p.total.toLocaleString()}${p.isCustom ? '<div style="font-size:9px;color:var(--accent)">時給計算</div>' : ''}${p.logiBonus ? `<div style="font-size:10px;color:var(--green-dark)">+¥${p.logiBonus.toLocaleString()} ロジ</div>` : ''}${extraLabels}`;
            const distLabel = !sel.lat || !v?.lat ? '<span style="color:var(--red);font-size:10px">座標未設定</span>'
              : dist > 0 ? `<span style="font-size:11px">${dist.toFixed(1)}km</span>`
              : dist === null ? '<span style="font-size:11px;color:var(--ink-faint)">-</span>'
              : '-';
            return `<tr style="cursor:pointer" onclick="openExtraCostModal(${sel.id},${e.id})" title="クリックで追加費用を編集">
              <td style="white-space:nowrap;font-weight:500">${e.date}</td>
              <td style="font-size:12px;color:var(--ink-soft);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v?.name||'-'}</td>
              <td><span class="badge ${c?.color||'badge-gray'}" style="font-size:10px">${c?.name||''}</span></td>
              <td style="font-size:12px;text-align:center">${timeCell}</td>
              <td style="text-align:center">${roleBadges}</td>
              <td style="text-align:right;color:var(--ink-soft)">${distLabel}</td>
              <td style="text-align:right;font-weight:500">${payCell}</td>
            </tr>`;
          }).join('');
          // 事前準備作業の行
          const monthPrepWork = allPrepWork.filter(pw => pw.date.startsWith(month)).sort((a,b) => a.date.localeCompare(b.date));
          mPrep = 0;
          prepRows = monthPrepWork.map(pw => {
            const total = Math.floor((pw.hours || 0) * (pw.hourlyRate || 0));
            mPrep += total;
            return `<tr style="background:var(--purple-light);cursor:pointer" onclick="openPrepWorkModal(${sel.id},'${pw.id}')" title="クリックで編集">
              <td style="white-space:nowrap;font-weight:500">${pw.date}</td>
              <td colspan="2" style="font-size:12px;color:var(--purple)">${pw.description || '事前準備'}</td>
              <td style="font-size:12px;text-align:center">${Math.floor(pw.hours)}h${Math.round((pw.hours%1)*60) ? Math.round((pw.hours%1)*60)+'m' : ''}</td>
              <td style="text-align:center"><span class="badge badge-purple" style="font-size:10px">準備</span></td>
              <td style="text-align:right;font-size:11px;color:var(--ink-soft)">@¥${(pw.hourlyRate||0).toLocaleString()}</td>
              <td style="text-align:right;font-weight:500;color:var(--purple)">¥${total.toLocaleString()}</td>
            </tr>`;
          }).join('');
          calcedTransport = transportAmt(mDist, month);
          mTransport = getMonthTransport(sel.id, month, mDist);
          customTransportEntry = getCustomTransportEntry(sel.id, month);
          isCustomTransport = customTransportEntry != null;
          customTransportNote = isCustomTransport ? (customTransportEntry.note || '') : '';
        }
        grandPay += mPay; grandTransport += mTransport; grandExtra += mExtra; grandPrep += mPrep;
        const [yr, mo] = month.split('-');
        const ml = `${yr}年${parseInt(mo)}月`;
        const tier = TRANSPORT_TABLE.find(([a,b]) => mDist >= a && mDist < b);
        const tierLabel = !sel.lat ? '座標未設定'
          : mDist === 0 ? '-'
          : tier ? `往復 ${mDist.toFixed(1)}km（${tier[0]}〜${tier[1]}km区間）`
          : mDist >= 200 ? `往復 ${mDist.toFixed(1)}km（200km超）`
          : `往復 ${mDist.toFixed(1)}km（10km未満・無料）`;
        const isPayOpen = _openPayMonths.has(month);
        const evCount = snap ? (snap.events||[]).length : mes.length;
        const prepCount = snap ? (snap.prepWork||[]).length : allPrepWork.filter(pw => pw.date.startsWith(month)).length;
        const isLocked = !!snap;
        return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 16px 11px 14px;
                      background:var(--surface-2);border-bottom:1px solid var(--surface-3);border-top:3px solid var(--surface-3);border-left:4px solid ${isLocked?'var(--green-dark)':'var(--accent)'};cursor:pointer"
               onclick="if(_openPayMonths.has('${month}'))_openPayMonths.delete('${month}');else _openPayMonths.add('${month}');renderPage()">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:11px;color:var(--ink-soft);transition:transform 0.2s;display:inline-block;transform:rotate(${isPayOpen?'90':'0'}deg)">▶</span>
              <span style="font-size:13px;font-weight:600;color:var(--ink)">${ml}</span>${isLocked?'<span style="font-size:10px;color:var(--green-dark)">🔒</span>':''}
              <span style="font-size:12px;color:var(--ink-soft)">${evCount}件${prepCount ? ` +準備${prepCount}件` : ''}</span>
              <span style="font-size:12px;font-weight:500;color:var(--accent)">¥${(mPay+mTransport+mExtra+mPrep).toLocaleString()}</span>
            </div>
            <div onclick="event.stopPropagation();cyclePayStatus(${sel.id},'${month}');renderPage()" style="cursor:pointer;user-select:none">${(()=>{const _ps=(load(SK.payStatus,{})[`${sel.id}:${month}`])||'pending';const _pa=load('staff_mgmt_paid_amounts',{})[`${sel.id}:${month}`];const _df=_ps==='paid'&&_pa!=null?Math.max(0,(mPay+mTransport+mExtra+mPrep)-_pa):0;return payStatusBadge(_ps,_df);})()}</div>
          </div>
          ${isPayOpen ? `<table>
            <thead><tr>
              <th>日付</th><th>会場</th><th>カテゴリ</th>
              <th style="text-align:center">時間</th><th style="text-align:center">役割</th>
              <th style="text-align:right">距離</th>
              <th style="text-align:right">給与</th>
            </tr></thead>
            <tbody>${rows}${prepRows}</tbody>
            <tfoot><tr style="background:var(--surface-2)">
              <td colspan="4" style="font-size:12px;color:var(--ink-soft);padding:8px 12px">${evCount}件${prepCount ? ` + 準備${prepCount}件` : ''}</td>

  if (activeTab === 'billing') {

        + '</form></div></div>';
    } else {

        + '<button class="btn btn-sm" onclick="_billingUnlocked=false;renderPage()">🔒 ロック</button>'
        + '</div>';

    body = billingBody;

  // ══════════════════════════════════════════
  // イベント別
  // ══════════════════════════════════════════

          <td>${s?.name||'-'}</td>

  content.innerHTML = `
    <div class="tab-bar">
      ${tabs.map(t=>`<div class="tab ${activeTab===t.id?'active':''}" onclick="activeTab='${t.id}';renderPage()">${t.label}</div>`).join('')}

}

function renderInvoices(content, right) {
  right.innerHTML = `<button class="btn btn-primary" onclick="openInvoiceModal()">+ 請求書追加</button>`;
  const invoices = load(SK.invoices, []);

  if (!invoices.length) {
    content.innerHTML = '<div class="card"><div class="empty-state" style="padding:40px">請求書が登録されていません</div></div>';
    return;
  }

  // 月別グループ化
  const byMonth = {};
  invoices.forEach(inv => {
    const m = (inv.date || '').slice(0,7) || '未設定';
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(inv);
  });

  const currentMonth = new Date().toISOString().slice(0,7);
  let grandTotal = 0, grandPaid = 0, grandUnpaid = 0;

  const monthBlocks = Object.entries(byMonth).sort((a,b) => b[0].localeCompare(a[0])).map(([month, invs]) => {
    const mTotal = invs.reduce((s,i) => s + (i.amount||0), 0);
    const mPaid = invs.filter(i => i.paid).reduce((s,i) => s + (i.amount||0), 0);
    const mUnpaid = mTotal - mPaid;
    grandTotal += mTotal; grandPaid += mPaid; grandUnpaid += mUnpaid;
    const [yr, mo] = month.split('-');
    const ml = yr && mo ? `${yr}年${parseInt(mo)}月` : month;

    const rows = invs.sort((a,b) => (a.date||'').localeCompare(b.date||'')).map(inv => {
      return `<tr>
        <td style="white-space:nowrap;font-weight:500">${inv.date||'-'}</td>
        <td style="font-weight:500">${inv.vendor||'-'}</td>
        <td style="font-size:12px;color:var(--ink-soft);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${inv.description||'-'}</td>
        <td style="text-align:right;font-weight:500">¥${(inv.amount||0).toLocaleString()}</td>
        <td style="text-align:center">
          <span onclick="toggleInvoicePaid('${inv.id}')" style="cursor:pointer;user-select:none">
            ${inv.paid
              ? '<span style="display:inline-block;background:#34c759;color:#fff;border-radius:3px;padding:2px 8px;font-size:10px">振込済</span>'
              : '<span style="display:inline-block;background:#ff9500;color:#fff;border-radius:3px;padding:2px 8px;font-size:10px">未振込</span>'}
          </span>
        </td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm" onclick="openInvoiceModal('${inv.id}')">編集</button>
          <button class="btn btn-sm btn-danger" style="margin-left:4px" onclick="deleteInvoice('${inv.id}')">削除</button>
        </td>
      </tr>`;
    }).join('');

    return `<div class="card" style="margin-bottom:16px;overflow:hidden">
      <div style="padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--surface-3);display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:14px;font-weight:600">${ml} <span style="font-size:12px;font-weight:400;color:var(--ink-soft)">${invs.length}件</span></div>
        <div style="display:flex;gap:12px;font-size:12px">
          <span>合計 <strong>¥${mTotal.toLocaleString()}</strong></span>
          ${mPaid ? '<span style="color:#34c759">振込済 ¥' + mPaid.toLocaleString() + '</span>' : ''}
          ${mUnpaid ? '<span style="color:#ff9500">未振込 <strong>¥' + mUnpaid.toLocaleString() + '</strong></span>' : ''}
        </div>
      </div>
      <div style="padding:0"><table>
        <thead><tr><th>日付</th><th>請求元</th><th>内容</th><th style="text-align:right">金額</th><th style="text-align:center">状態</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }).join('');

  const summaryHtml = `<div class="card" style="margin-bottom:16px;padding:16px;display:flex;gap:24px;align-items:center;flex-wrap:wrap">
    <div><div style="font-size:10px;color:var(--ink-soft)">総合計</div><div style="font-size:18px;font-weight:500">¥${grandTotal.toLocaleString()}</div></div>
    <div><div style="font-size:10px;color:#34c759">振込済</div><div style="font-size:18px;font-weight:500;color:#34c759">¥${grandPaid.toLocaleString()}</div></div>
    <div><div style="font-size:10px;color:#ff9500">未振込</div><div style="font-size:18px;font-weight:500;color:#ff9500">¥${grandUnpaid.toLocaleString()}</div></div>
  </div>`;

  content.innerHTML = summaryHtml + monthBlocks;
}

function openInvoiceModal(editId) {
  const invoices = load(SK.invoices, []);
  const existing = editId ? invoices.find(x => x.id === editId) : null;
  const today = new Date().toISOString().slice(0,10);

  openModal(`<div class="modal" style="max-width:460px">
    <div class="modal-header"><h3>${existing ? '請求書を編集' : '請求書を追加'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">請求元（会社名）<span class="req">*</span></label>
        <input type="text" class="form-control" id="invVendor" value="${existing ? existing.vendor||'' : ''}" placeholder="例：株式会社○○">
      </div>
      <div style="display:flex;gap:10px">
        <div class="form-group" style="flex:1">
          <label class="form-label">請求日<span class="req">*</span></label>
          <input type="date" class="form-control" id="invDate" value="${existing ? existing.date||'' : today}">
        </div>
        <div class="form-group" style="flex:1">
          <label class="form-label">金額（円）<span class="req">*</span></label>
          <input type="number" class="form-control" id="invAmount" value="${existing ? existing.amount||'' : ''}" placeholder="例：50000">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">内容</label>
        <input type="text" class="form-control" id="invDesc" value="${existing ? existing.description||'' : ''}" placeholder="例：会場設営費、印刷代等">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveInvoice('${editId||''}')">保存</button>
    </div>
  </div>`);
}

function saveInvoice(editId) {
  const vendor = document.getElementById('invVendor')?.value.trim();
  const date = document.getElementById('invDate')?.value;
  const amount = parseInt(document.getElementById('invAmount')?.value) || 0;
  const description = document.getElementById('invDesc')?.value.trim();

  if (!vendor) { alert('請求元を入力してください'); return; }
  if (!date) { alert('請求日を入力してください'); return; }
  if (!amount) { alert('金額を入力してください'); return; }

  const invoices = load(SK.invoices, []);
  if (editId) {
    const inv = invoices.find(x => x.id === editId);
    if (inv) { inv.vendor = vendor; inv.date = date; inv.amount = amount; inv.description = description; }
  } else {
    const id = Math.random().toString(36).slice(2, 9);
    invoices.push({ id, vendor, date, amount, description, paid: false });
  }
  save(SK.invoices, invoices);
  closeModal();
  renderPage();
}

function toggleInvoicePaid(id) {
  const invoices = load(SK.invoices, []);
  const inv = invoices.find(x => x.id === id);
  if (inv) inv.paid = !inv.paid;
  save(SK.invoices, invoices);
  renderPage();
}

function deleteInvoice(id) {
  if (!confirm('この請求書を削除しますか？')) return;
  save(SK.invoices, load(SK.invoices, []).filter(x => x.id !== id));
  renderPage();
}

async function syncNow() {
  const el = document.getElementById('gasTestResult');
  if (el) { el.style.color = 'var(--ink-soft)'; el.textContent = '送信中…'; }
  await pushToGAS();
  if (el) {
    if (_syncStatus === 'synced') { el.style.color = '#1e7e34'; el.textContent = '✓ 送信成功！他のデバイスは20秒以内に反映されます。'; }
    else { el.style.color = 'var(--red)'; el.textContent = '✗ 送信失敗。以下のチェックリストを確認してください。'; showGasTroubleshoot(el); }
  }
}
async function testGasConnection() {
  const el = document.getElementById('gasTestResult');
  if (!el) return;
  const url = localStorage.getItem(SK.gasUrl);
  if (!url) { el.textContent = 'URLが設定されていません'; return; }
  el.style.color = 'var(--ink-soft)'; el.textContent = '接続確認中…';
  try {
    const res = await fetch(`${url}?action=getStaffData`);
    if (!res.ok) { el.style.color = 'var(--red)'; el.textContent = `✗ HTTPエラー ${res.status}`; showGasTroubleshoot(el); return; }
    const json = await res.json();
    if (json.ok !== undefined) {
      el.style.color = '#1e7e34';
      el.textContent = `✓ 接続成功！（保存データ: ${json.data ? 'あり' : 'なし'}, version: ${json.version}）`;
    } else {
      el.style.color = 'var(--red)'; el.textContent = '✗ GASの応答が不正です。コードを確認してください。'; showGasTroubleshoot(el);
    }
  } catch(e) {
    el.style.color = 'var(--red)';
    el.textContent = `✗ 接続エラー: ${e.message}`;
    showGasTroubleshoot(el);
  }
}
async function fetchNowDebug() {
  const el = document.getElementById('gasTestResult');
  if (!el) { alert('表示エリアが見つかりません。ページを再読み込みしてください。'); return; }
  el.style.color = 'var(--ink-soft)'; el.textContent = '▶ 開始…';

  const url = localStorage.getItem(SK.gasUrl);
  if (!url) {
    el.style.color = 'var(--red)';
    el.textContent = '✗ このデバイスにGAS URLが設定されていません。\n上の欄にURLを貼り付けて「保存」してください。';
    return;
  }
  el.textContent = `受信中… URL: ${url.slice(0,60)}…`;

  // 30秒タイムアウト（タイマー直接制御）
  let _timedOut = false;
  const _tid = setTimeout(() => {
    _timedOut = true;
    alert('タイムアウト（30秒）: GASが応答しません。\n\n「ブラウザで直接開く」ボタンを押して、JSONデータが表示されるか確認してください。\nGoogleのログイン画面が出る場合はGASの「アクセス：全員」の設定を再確認してください。');
  }, 30000);

  try {
    const res = await fetch(`${url}?action=getStaffData`);
    clearTimeout(_tid);
    if (_timedOut) return;
    alert(`HTTPステータス: ${res.status}\n次にレスポンス内容を確認します`);
    const text = await res.text();
    alert(`レスポンス(先頭200文字):\n${text.slice(0,200)}`);
    let json;
    try { json = JSON.parse(text); } catch {
      alert('JSONパース失敗。GASのコードを確認してください。');
      return;
    }
    if (!json.ok) { alert(`GASエラー: ${json.error||'不明'}`); return; }
    if (!json.data) { alert('GASにデータなし。送信デバイスで「全データ送信」を実行してください。'); return; }
    alert(`✓ 取得成功！\nキー: ${Object.keys(json.data).join(', ')}\n\nこれからlocalStorageに反映します`);
    _syncVersion = 0;
    applySyncData(json.data);
    _syncVersion = json.version;
    renderSidebar(); renderPage();
    alert('✓ 完了！画面に反映しました。');
  } catch(e) {
    clearTimeout(_tid);
    alert(`通信エラー:\nname: ${e.name}\nmessage: ${e.message}\n\nGASのURLをブラウザで直接開いて確認してください。`);
  }
}

function applyEventCatDefaults() {
  const catId = parseInt(document.getElementById('f_cat').value);
  const cats  = load(SK.cats,[]);
  const cat   = cats.find(c=>c.id===catId);
  if (!cat) return;
  if (cat.opStart)       document.getElementById('f_start').value     = cat.opStart;
  if (cat.opEnd)         document.getElementById('f_end').value       = cat.opEnd;
  if (cat.opBreak!=null) document.getElementById('f_break').value     = cat.opBreak;
  if (cat.studyHours!=null) document.getElementById('f_study').value  = cat.studyHours;
  const ldrStudy = cat.ldrStudyHours ?? cat.studyHours;
  if (ldrStudy != null)  document.getElementById('f_ldr_study').value = ldrStudy;
  if (cat.defaultRequiredCount) document.getElementById('f_req').value = cat.defaultRequiredCount;
  calcOpHours();
}

// 当日運営時間を自動計算して表示
function calcOpHours() {
  const start = document.getElementById('f_start')?.value;
  const end   = document.getElementById('f_end')?.value;
  const brk   = parseInt(document.getElementById('f_break')?.value) || 0;
  const disp  = document.getElementById('f_op_hours_display');
  if (!disp) return;
  if (!start || !end) { disp.textContent = ''; return; }
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  const totalMin = (eh * 60 + em) - (sh * 60 + sm) - brk;
  if (totalMin <= 0) { disp.textContent = '⚠ 時間を確認してください'; disp.style.color = 'var(--red)'; return; }
  disp.style.color = 'var(--accent)';
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  disp.textContent = `当日運営時間：${h}時間${m > 0 ? m + '分' : ''}`;
}

function saveEvent(id) {
  const date = document.getElementById('f_date').value;
  if (!date){ alert('日付を入力'); return; }
  const venueId    = parseInt(document.getElementById('f_venue').value);
  const categoryId = parseInt(document.getElementById('f_cat').value);
  const req        = parseInt(document.getElementById('f_req').value);
  const opStart     = document.getElementById('f_start').value;
  const opEnd       = document.getElementById('f_end').value;
  const opBreak     = parseInt(document.getElementById('f_break').value) || 0;
  const studyHours  = parseFloat(document.getElementById('f_study').value) || 0;
  const ldrStudyHours = parseFloat(document.getElementById('f_ldr_study').value) || 0;
  const venues2     = load(SK.venues,[]);
  const selVenue    = venues2.find(v=>v.id===venueId);
  const placeName   = selVenue?.name || '';
  const content     = document.getElementById('f_content')?.value.trim() || '';
  // nameフィールドも更新（後方互換）
  const d = new Date(date+'T00:00:00');
  const days=['日','月','火','水','木','金','土'];
  const dateStr = `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
  const name = placeName||content ? `${dateStr} ${placeName}${content?'：'+content:''}` : '';
  const evs = load(SK.events,[]);
  if (id) {
    Object.assign(evs.find(e=>e.id===id), {date, venueId, categoryId, requiredCount:req, opStart, opEnd, opBreak, studyHours, ldrStudyHours, placeName, content, name});
  } else {
    const newId = (evs.length ? Math.max(...evs.map(e=>e.id)) : 0) + 1;
    evs.push({id:newId, date, venueId, categoryId, requiredCount:req,
      staffAssignments:[], attendance:{}, opStart, opEnd, opBreak, studyHours, ldrStudyHours, placeName, content, name, makers:[]});
  }
  save(SK.events, evs);
  const syncedEv = evs.find(e => e.id === (id || Math.max(...evs.map(e=>e.id))));
  if (syncedEv) syncEventToWorkflow(syncedEv);
  closeModal(); renderPage();
}

function catColorToHex(cls) {
  return { 'badge-green':'#34c759','badge-purple':'#7b68ee','badge-amber':'#ff9500',
           'badge-blue':'#007aff','badge-red':'#ff3b30','badge-gray':'#8e8e93' }[cls] || '#e07840';
}

function showToast(msg, ok) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:13px;color:#fff;z-index:9999;pointer-events:none;transition:opacity 0.4s';
  t.style.background = ok === false ? '#e53e3e' : '#38a169';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 2500);
}

function syncEventToWorkflow(ev) {
  try {
    const venues2 = load(SK.venues, []);
    const venue = venues2.find(v => v.id === ev.venueId);
    const venueName = venue?.shortName || venue?.name || '';
    const dateParts = (ev.date||'').split('-');
    const y = dateParts[0], mo = dateParts[1], dy = dateParts[2];
    if (!y) return;
    const parts = [`${y.slice(2)}${mo}${dy}`];
    if (venueName) parts.push(venueName);
    if (ev.content?.trim()) parts.push(ev.content.trim());
    const projName = parts.join('_');

    let wfData;
    try { wfData = JSON.parse(localStorage.getItem('kodawarin_tasks') || 'null'); } catch(e) {}
    if (!wfData || typeof wfData !== 'object') wfData = { projects: [], tasks: [], members: [] };
    if (!Array.isArray(wfData.projects)) wfData.projects = [];
    if (!Array.isArray(wfData.tasks)) wfData.tasks = [];

    const projId = 'es_ev_' + ev.id;
    const cat = load(SK.cats, []).find(c => c.id === ev.categoryId);
    const existingIdx = wfData.projects.findIndex(p => p.id === projId);

    if (existingIdx >= 0) {
      Object.assign(wfData.projects[existingIdx], {
        name: projName, eventDate: ev.date, venue: venueName,
        content: ev.content||'', start: ev.date, end: ev.date,
      });
      localStorage.setItem('kodawarin_tasks', JSON.stringify(wfData));
      pushToWorkflowGAS(wfData);
      showToast('ワークフロー更新: ' + projName);
    } else {
      wfData.projects.push({
        id: projId, type: 'event', name: projName,
        color: cat ? catColorToHex(cat.color) : '#e07840',
        isPrivate: false, memo: '', visibleMemberIds: [], links: [],
        eventDate: ev.date, venue: venueName, content: ev.content||'',
        start: ev.date, end: ev.date,
      });
      localStorage.setItem('kodawarin_tasks', JSON.stringify(wfData));
      pushToWorkflowGAS(wfData);
      showToast('ワークフローにプロジェクト作成: ' + projName);
    }
  } catch(e) {
    console.error('syncEventToWorkflow error', e);
    showToast('同期エラー: ' + e.message, false);
  }
}

function pushToWorkflowGAS(data) {
  const url = localStorage.getItem('wf_gasUrl') || '';
  if (!url) return;
  fetch(url, { method: 'POST', body: JSON.stringify({ action: 'saveWorkflowData', data }) }).catch(() => {});
}

function syncAllEventsToWorkflow() {
  const evs = load(SK.events, []);
  if (evs.length === 0) {
    document.getElementById('wfSyncResult').textContent = 'イベントがありません';
    return;
  }
  evs.forEach(ev => syncEventToWorkflow(ev));
  const el = document.getElementById('wfSyncResult');
  if (el) el.textContent = `${evs.length}件のイベントを同期しました`;
}

function saveStaff(id) {
  const name=document.getElementById('f_name').value.trim();
  if (!name){alert('名前を入力');return;}
  const staffs=load(SK.staffs,[]);
  const addrSearch = document.getElementById('f_addrSearch').value.trim();
  // name変更時にlastName/firstNameも同期（スペースで分割、なければnameをlastNameに）
  const nameParts = name.split(/[\s　]/);
  const syncedLastName  = nameParts[0] || '';
  const syncedFirstName = nameParts.slice(1).join('') || '';
  const data = {
    name, kana:document.getElementById('f_kana').value.trim(),
    lastName: syncedLastName, firstName: syncedFirstName,
    rankId:parseInt(document.getElementById('f_rank').value),
    birthday:document.getElementById('f_birthday').value,
    phone:document.getElementById('f_phone').value.trim(),
    email:document.getElementById('f_email').value.trim(),
    address:addrSearch,
    lat:parseFloat(document.getElementById('f_lat').value)||null,
    lng:parseFloat(document.getElementById('f_lng').value)||null,
    station:document.getElementById('f_station').value.trim(),
    bankName:document.getElementById('f_bank').value.trim(),
    branchName:document.getElementById('f_branch').value.trim(),
    branchCode:document.getElementById('f_branchcode').value.trim(),
    accountType:document.getElementById('f_actype').value,
    accountNumber:document.getElementById('f_acnum').value.trim(),
    accountHolder:document.getElementById('f_acholder').value.trim(),
    contractSigned:document.getElementById('f_contract').checked,
  };
  if (id) { invalidateDistForStaff(id); Object.assign(staffs.find(s=>s.id===id), data); }
  else {
    const newId=(staffs.length?Math.max(...staffs.map(s=>s.id)):0)+1;
    staffs.push({id:newId,...data});
  }
  save(SK.staffs,staffs); closeModal(); renderPage();
}
function archiveStaff(id){
  if(!confirm('このスタッフをアーカイブしますか？\n（過去のスタッフに移動します）'))return;
  const staffs=load(SK.staffs,[]);
  const s=staffs.find(x=>x.id===id);
  if(!s)return;
  const archived=load(SK.archivedStaffs,[]);
  s.archivedAt=new Date().toISOString();
  archived.push(s);
  save(SK.archivedStaffs,archived);
  save(SK.staffs,staffs.filter(x=>x.id!==id));
  renderPage();
}
function restoreStaff(id){
  const archived=load(SK.archivedStaffs,[]);
  const s=archived.find(x=>x.id===id);
  if(!s)return;
  delete s.archivedAt;
  const staffs=load(SK.staffs,[]);
  staffs.push(s);
  save(SK.staffs,staffs);
  save(SK.archivedStaffs,archived.filter(x=>x.id!==id));
  renderPage();
}
function deleteStaffPermanently(id){
  if(!confirm('完全に削除しますか？この操作は取り消せません。'))return;
  save(SK.archivedStaffs,load(SK.archivedStaffs,[]).filter(s=>s.id!==id));
  renderPage();
}
function deleteStaff(id){
  if(!confirm('削除しますか？'))return;
  save(SK.staffs,load(SK.staffs,[]).filter(s=>s.id!==id)); renderPage();
}
function moveStaffCol(staffId, dir) {
  const staffs = load(SK.staffs, []);
  const stored = load(SK.staffOrder, staffs.map(s => s.id));
  const validSet = new Set(staffs.map(s => s.id));
  const order = [...stored.filter(id => validSet.has(id)), ...staffs.filter(s => !stored.includes(s.id)).map(s => s.id)];
  const idx = order.indexOf(staffId);
  if (idx === -1) return;
  const swap = idx + dir;
  if (swap < 0 || swap >= order.length) return;
  [order[idx], order[swap]] = [order[swap], order[idx]];
  save(SK.staffOrder, order);
  renderPage();
}
function toggleLogi(evId, staffId) {
  const evs = load(SK.events,[]);
  const ev  = evs.find(e=>e.id===evId);
  if (!ev) return;
  const a = ev.staffAssignments.find(x=>x.staffId===staffId);
  if (a) a.isLogi = !a.isLogi;
  save(SK.events, evs);
  renderPage();
}

function cycleRank(staffId) {
  const staffs = load(SK.staffs,[]);
  const ranks  = load(SK.ranks,[]).sort((a,b)=>a.level-b.level);
  const s = staffs.find(x=>x.id===staffId);
  if (!s || !ranks.length) return;
  const cur = ranks.findIndex(r=>r.id===s.rankId);
  s.rankId = ranks[(cur+1) % ranks.length].id;
  save(SK.staffs, staffs);
  renderPage();
}

function toggleContract(id){
  const staffs=load(SK.staffs,[]);
  const s=staffs.find(x=>x.id===id);
  if(!s)return;
  s.contractSigned=!s.contractSigned;
  save(SK.staffs,staffs); renderPage();
}

  const vs=load(SK.venues,[]);
  const data={name,shortName:document.getElementById('f_vshort').value.trim(),address:document.getElementById('f_vaddrSearch').value.trim(),lat:parseFloat(document.getElementById('f_vlat').value)||null,lng:parseFloat(document.getElementById('f_vlng').value)||null};

  else{ const newId=(vs.length?Math.max(...vs.map(x=>x.id)):0)+1; vs.push({id:newId,...data}); }
  save(SK.venues,vs);
  closeModal();
  renderPage();
  if (window._afterVenueSave) {
    const cb = window._afterVenueSave;
    window._afterVenueSave = null;
    setTimeout(cb, 50);
  }

function calcContractPrepRate(row) {
  const amt = parseFloat(row.querySelector('[data-cp="amount"]').value) || 0;
  const hrs = parseFloat(row.querySelector('[data-cp="hours"]').value) || 0;
  const rateEl = row.querySelector('[data-cp="rate"]');
  rateEl.textContent = hrs > 0 ? '≈' + Math.floor(amt / hrs) + '円/h' : '—';
  updateContractPrepTotal();
}

function updateContractPrepTotal() {
  const rows = document.querySelectorAll('#cew_cp_rows .cp-row');
  let total = 0;
  rows.forEach(r => { total += parseFloat(r.querySelector('[data-cp="amount"]').value) || 0; });
  const el = document.getElementById('cew_cp_total');
  if (el) el.textContent = '合計: ¥' + total.toLocaleString();
}

function saveCatEditModal(catId) {
  const cats  = load(SK.cats,[]);
  const ranks = load(SK.ranks,[]);
  const c = cats.find(x=>x.id===catId);
  if (!c) return;

  c.studyHours    = parseFloat(document.getElementById('cew_study').value)    || 0;
  c.opBreak       = parseInt(document.getElementById('cew_break').value)       || 0;
  c.opStart       = document.getElementById('cew_start').value;
  c.opEnd         = document.getElementById('cew_end').value;
  c.ldrStudyHours = parseFloat(document.getElementById('cew_ldr_study').value) || 0;
  c.ldrOpBreak    = parseInt(document.getElementById('cew_ldr_break').value)   || 0;
  c.ldrOpStart    = document.getElementById('cew_ldr_start').value;
  c.ldrOpEnd      = document.getElementById('cew_ldr_end').value;
  c.leaderDailyWage = parseInt(document.getElementById('cew_ldr_wage').value)  || 0;
  c.logiWage        = parseInt(document.getElementById('cew_logi_wage').value) || 0;

  // 業務委託 事前準備項目を保存
  const cpRows = document.querySelectorAll('#cew_cp_rows .cp-row');
  c.contractPrepItems = [];
  cpRows.forEach(row => {
    const name = row.querySelector('[data-cp="name"]').value.trim();
    const amount = parseInt(row.querySelector('[data-cp="amount"]').value) || 0;
    const hours = parseFloat(row.querySelector('[data-cp="hours"]').value) || 0;
    if (name || amount > 0) {
      c.contractPrepItems.push({ name, amount, hours });
    }
  });

  if (!c.rankWages) c.rankWages = {};
  ranks.forEach(r => {
    const val = parseInt(document.getElementById(`cew_rank_${r.id}`)?.value) || 0;
    c.rankWages[r.id]         = val;
    c.rankWages[String(r.id)] = val;
  });

  save(SK.cats, cats);
  closeModal();
  renderPage();
}

function saveCat(id) {
  const name=document.getElementById('f_cname').value.trim();
  if(!name){alert('名前を入力');return;}
  const cs=load(SK.cats,[]);
  const ranks=load(SK.ranks,[]);
  const defaultRequiredCount=parseInt(document.getElementById('f_creq')?.value)||3;
  const data={name,color:document.getElementById('f_cc').value,defaultRequiredCount};
  if(id){
    Object.assign(cs.find(x=>x.id===id),data);
  } else {
    const newId=(cs.length?Math.max(...cs.map(x=>x.id)):0)+1;
    const rankWages={};
    ranks.forEach(r=>{ rankWages[r.id]=0; });
    cs.push({id:newId,...data,
      studyHours:1, opStart:'10:00', opEnd:'17:00', opBreak:0,
      rankWages, leaderDailyWage:0,
      ldrStudyHours:1, ldrOpStart:'10:00', ldrOpEnd:'17:00', ldrOpBreak:0
    });
  }
  save(SK.cats,cs); closeModal(); renderPage();
}

function moveCatOrder(catId, dir) {
  const cats = load(SK.cats, []);
  const idx = cats.findIndex(c => c.id === catId);
  if (idx === -1) return;
  const swap = idx + dir;
  if (swap < 0 || swap >= cats.length) return;
  [cats[idx], cats[swap]] = [cats[swap], cats[idx]];
  save(SK.cats, cats);
  renderPage();
}

function openStaffTimeModal(staffId, eventId) {
  const events = load(SK.events,[]);
  const staffs = load(SK.staffs,[]);
  const cats = load(SK.cats,[]);
  const ranks = load(SK.ranks,[]);
  const e = events.find(x=>x.id===eventId);
  const s = staffs.find(x=>x.id===staffId);
  if (!e || !s) return;
  const a = e.staffAssignments.find(x=>x.staffId===staffId);
  if (!a) return;
  const cat = cats.find(c=>c.id===e.categoryId);
  const rank = ranks.find(r=>r.id===s.rankId);
  const h = calcEventHours(e);
  const defaultOp = h.opHours;
  const defaultStudy = a.isLeader ? (e.ldrStudyHours ?? h.studyHours) : h.studyHours;
  const curOp = a.customOpHours != null ? a.customOpHours : defaultOp;
  const curStudy = a.customStudyHours != null ? a.customStudyHours : defaultStudy;
  const isCustom = a.customOpHours != null || a.customStudyHours != null;
  // 始業・終業・休憩の標準値
  const stdStart = a.isLeader ? (cat?.ldrOpStart || e.opStart || '') : (e.opStart || '');
  const stdEnd = a.isLeader ? (cat?.ldrOpEnd || e.opEnd || '') : (e.opEnd || '');
  const stdBreak = a.isLeader ? (cat?.ldrOpBreak != null ? cat.ldrOpBreak : (e.opBreak||0)) : (e.opBreak||0);
  const curStart = a.customOpStart || stdStart;
  const curEnd = a.customOpEnd || stdEnd;
  const curBreak = a.customBreak != null ? a.customBreak : stdBreak;

  // 時給を表示用に計算
  let hourlyLabel = '';
  if (cat && rank) {
    if (a.isLeader) {
      const dw = cat.leaderDailyWage || 0;
      const ldrOp = timeToHours(cat.ldrOpStart||cat.opStart, cat.ldrOpEnd||cat.opEnd, cat.ldrOpBreak!=null?cat.ldrOpBreak:(cat.opBreak||0)) || 7;
      const ldrStudy = cat.ldrStudyHours != null ? cat.ldrStudyHours : (cat.studyHours||1);
      hourlyLabel = `時給 ¥${Math.floor(calcHourlyRate(dw, roundHalfHour(ldrStudy), roundHalfHour(ldrOp))).toLocaleString()} （日給 ¥${dw.toLocaleString()}）`;
    } else {
      const dw = (cat.rankWages && (cat.rankWages[rank.id] || cat.rankWages[String(rank.id)])) || 0;
      const baseStudy = cat.studyHours || 1;
      const baseOp = timeToHours(cat.opStart, cat.opEnd, cat.opBreak||0) || 7;
      hourlyLabel = `時給 ¥${Math.floor(calcHourlyRate(dw, roundHalfHour(baseStudy), roundHalfHour(baseOp))).toLocaleString()} （日給 ¥${dw.toLocaleString()}）`;
    }
  }

  let _stHourly = 0;
  if (a.isLeader) {
    const dw = cat?.leaderDailyWage||0;
    const lOp = timeToHours(cat?.ldrOpStart||cat?.opStart,cat?.ldrOpEnd||cat?.opEnd,cat?.ldrOpBreak!=null?cat.ldrOpBreak:(cat?.opBreak||0))||7;
    const lSt = cat?.ldrStudyHours!=null?cat.ldrStudyHours:(cat?.studyHours||1);
    _stHourly = Math.floor(calcHourlyRate(dw, roundHalfHour(lSt), roundHalfHour(lOp)));
  } else {
    const dw = (cat?.rankWages&&(cat.rankWages[rank?.id]||cat.rankWages[String(rank?.id)]))||0;
    const bSt = cat?.studyHours||1;
    const bOp = timeToHours(cat?.opStart,cat?.opEnd,cat?.opBreak||0)||7;
    _stHourly = Math.floor(calcHourlyRate(dw, roundHalfHour(bSt), roundHalfHour(bOp)));
  }
  window._stHourly = _stHourly;

  openModal(`<div class="modal" style="max-width:460px">
    <div class="modal-header"><h3>${s.name} - ${e.date} 時間編集</h3></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px">${hourlyLabel}</div>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:12px">標準: ${stdStart}〜${stdEnd}（休憩${stdBreak}分） → 運営 ${defaultOp.toFixed(1)}h / 事前学習 ${defaultStudy}h</div>
      <div style="display:flex;gap:10px;margin-bottom:12px;align-items:end">
        <div style="flex:1">
          <label style="font-size:12px;font-weight:500;margin-bottom:4px;display:block">始業</label>
          <input type="time" id="f_custom_start" class="form-control" value="${curStart}" style="width:100%"
            oninput="calcStaffTimeFromInputs()">
        </div>
        <div style="font-size:16px;color:var(--ink-soft);padding-bottom:6px">〜</div>
        <div style="flex:1">
          <label style="font-size:12px;font-weight:500;margin-bottom:4px;display:block">終業</label>
          <input type="time" id="f_custom_end" class="form-control" value="${curEnd}" style="width:100%"
            oninput="calcStaffTimeFromInputs()">
        </div>
        <div style="flex:0.7">
          <label style="font-size:12px;font-weight:500;margin-bottom:4px;display:block">休憩(分)</label>
          <input type="number" id="f_custom_break" class="form-control" min="0" step="5" value="${curBreak}" style="width:100%"
            oninput="calcStaffTimeFromInputs()">
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <div style="flex:1">
          <label style="font-size:12px;font-weight:500;margin-bottom:4px;display:block">運営時間 (h)</label>
          <input type="number" id="f_custom_op" class="form-control" step="0.5" min="0" value="${curOp}" style="width:100%;background:var(--surface-2)" readonly>
        </div>
        <div style="flex:1">
          <label style="font-size:12px;font-weight:500;margin-bottom:4px;display:block">事前学習 (h)</label>
          <input type="number" id="f_custom_study" class="form-control" step="0.5" min="0" value="${curStudy}" style="width:100%"
            oninput="updateStaffTimePreview()">
        </div>
      </div>
      <div id="staffTimeCalcDetail" style="font-size:11px;color:var(--ink-soft);padding:8px 10px;background:var(--surface-2);border-radius:6px;margin-bottom:8px"></div>
      <div id="staffTimePreview" style="font-size:14px;font-weight:500;padding:10px;background:var(--accent-light);border-radius:8px;margin-bottom:16px;text-align:center"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        ${isCustom ? '<button class="btn btn-sm" onclick="resetStaffTime('+staffId+','+eventId+');closeModal()" style="margin-right:auto;color:var(--red)">標準に戻す</button>' : ''}
        <button class="btn" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveStaffTime(${staffId},${eventId});closeModal()">保存</button>
      </div>
    </div>
  </div>`);
  calcStaffTimeFromInputs();
}

function calcStaffTimeFromInputs() {
  var startEl=document.getElementById('f_custom_start'), endEl=document.getElementById('f_custom_end'), breakEl=document.getElementById('f_custom_break'), opEl=document.getElementById('f_custom_op');
  if (!startEl||!endEl||!breakEl||!opEl) return;
  var s=startEl.value, en=endEl.value, br=parseInt(breakEl.value)||0;
  if (s && en) {
    var sh=s.split(':').map(Number), eh=en.split(':').map(Number);
    var totalMin=(eh[0]*60+eh[1])-(sh[0]*60+sh[1])-br;
    var opH=Math.max(0,totalMin/60);
    opEl.value=opH.toFixed(1);
  }
  updateStaffTimePreview();
}
function updateStaffTimePreview() {
  var opEl=document.getElementById('f_custom_op'), stEl=document.getElementById('f_custom_study'), prev=document.getElementById('staffTimePreview'), detail=document.getElementById('staffTimeCalcDetail');
  var startEl=document.getElementById('f_custom_start'), endEl=document.getElementById('f_custom_end'), breakEl=document.getElementById('f_custom_break');
  if (!opEl||!stEl||!prev) return;
  var op=parseFloat(opEl.value)||0, st=parseFloat(stEl.value)||0;
  var opR=roundHalfHour(op), stR=roundHalfHour(st);
  var hourly=window._stHourly||0;
  var effOp=opR<=8?opR:8+1.25*(opR-8);
  var sPay=Math.floor(hourly*stR), oPay=Math.floor(calcHoursWage(opR,hourly));
  var total=sPay+oPay;
  // 計算式
  if (detail) {
    var lines=[];
    if (startEl&&endEl&&startEl.value&&endEl.value) {
      var br=parseInt(breakEl.value)||0;
      lines.push(startEl.value+'〜'+endEl.value+(br>0?' − 休憩'+br+'分':'')+' = 運営 '+op.toFixed(1)+'h → 丸め '+opR.toFixed(1)+'h');
    }
    lines.push('事前学習 '+st+'h → 丸め '+stR+'h');
    if (opR>8) lines.push('運営8h超: 8h + ('+( opR-8).toFixed(1)+'h × 1.25) = '+effOp.toFixed(2)+'h');
    lines.push('事前学習: ¥'+hourly.toLocaleString()+' × '+stR+'h = ¥'+sPay.toLocaleString());
    lines.push('運営: ¥'+hourly.toLocaleString()+' × '+effOp.toFixed(2)+'h = ¥'+oPay.toLocaleString());
    detail.innerHTML=lines.join('<br>');
  }
  prev.innerHTML='<span style="color:var(--accent)">¥'+total.toLocaleString()+'</span> <span style="font-size:11px;font-weight:400;color:var(--ink-soft)">（時給¥'+hourly.toLocaleString()+'）</span>';
}

function saveStaffTime(staffId, eventId) {
  const events = load(SK.events,[]);
  const e = events.find(x=>x.id===eventId);
  if (!e) return;
  const a = e.staffAssignments.find(x=>x.staffId===staffId);
  if (!a) return;
  const opVal = parseFloat(document.getElementById('f_custom_op').value);
  const studyVal = parseFloat(document.getElementById('f_custom_study').value);
  const startVal = document.getElementById('f_custom_start').value;
  const endVal = document.getElementById('f_custom_end').value;
  const breakVal = parseInt(document.getElementById('f_custom_break').value)||0;
  const h = calcEventHours(e);
  const defaultOp = h.opHours;
  const defaultStudy = a.isLeader ? (e.ldrStudyHours ?? h.studyHours) : h.studyHours;
  const cats = load(SK.cats,[]);
  const cat = cats.find(c=>c.id===e.categoryId);
  const stdStart = a.isLeader ? (cat?.ldrOpStart || e.opStart || '') : (e.opStart || '');
  const stdEnd = a.isLeader ? (cat?.ldrOpEnd || e.opEnd || '') : (e.opEnd || '');
  const stdBreak = a.isLeader ? (cat?.ldrOpBreak != null ? cat.ldrOpBreak : (e.opBreak||0)) : (e.opBreak||0);
  // 標準値と同じなら上書きを削除
  if (Math.abs(opVal - defaultOp) < 0.01) delete a.customOpHours;
  else a.customOpHours = opVal;
  if (Math.abs(studyVal - defaultStudy) < 0.01) delete a.customStudyHours;
  else a.customStudyHours = studyVal;
  if (startVal === stdStart) delete a.customOpStart;
  else a.customOpStart = startVal;
  if (endVal === stdEnd) delete a.customOpEnd;
  else a.customOpEnd = endVal;
  if (breakVal === stdBreak) delete a.customBreak;
  else a.customBreak = breakVal;
  save(SK.events, events);
  renderPage();
}

function resetStaffTime(staffId, eventId) {
  const events = load(SK.events,[]);
  const e = events.find(x=>x.id===eventId);
  if (!e) return;
  const a = e.staffAssignments.find(x=>x.staffId===staffId);
  if (!a) return;
  delete a.customOpHours;
  delete a.customStudyHours;
  delete a.customOpStart;
  delete a.customOpEnd;
  delete a.customBreak;
  save(SK.events, events);
  renderPage();
}

  const key = `${staffId}:${eventId}`;
  const allExtras = load(SK.extraCosts, {});
  const extras = allExtras[key] || [];
  const presets = ['ETC','事前準備代','駐車場代','宿泊費','その他'];

  let rowsHtml = extras.map((x, i) => `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px" id="extraRow${i}">
      <input type="text" class="form-control" value="${x.label||''}" placeholder="項目名" style="flex:1;font-size:13px" id="extraLabel${i}">
      <input type="number" class="form-control" value="${x.amount||0}" placeholder="金額" style="width:100px;font-size:13px;text-align:right" id="extraAmt${i}">
      <button class="btn btn-sm btn-danger" onclick="removeExtraRow(${i})" style="padding:4px 8px">✕</button>
    </div>`).join('');

  openModal(`<div class="modal" style="max-width:420px">
    <div class="modal-header"><h3>追加費用</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px">${s.name} ／ ${e.date}</div>
      <div id="extraRows">${rowsHtml}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        ${presets.map(p => `<button class="btn btn-sm" onclick="addExtraRow('${p}')" style="font-size:11px">${p}</button>`).join('')}
        <button class="btn btn-sm" onclick="addExtraRow('')" style="font-size:11px">＋ 自由入力</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveExtraCosts(${staffId},${eventId})">保存</button>
    </div>
  </div>`);

  window._extraRowCount = extras.length;
}

function addExtraRow(label) {
  const i = window._extraRowCount || 0;
  const container = document.getElementById('extraRows');
  if (!container) return;
  container.insertAdjacentHTML('beforeend', `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px" id="extraRow${i}">
      <input type="text" class="form-control" value="${label}" placeholder="項目名" style="flex:1;font-size:13px" id="extraLabel${i}">
      <input type="number" class="form-control" value="" placeholder="金額" style="width:100px;font-size:13px;text-align:right" id="extraAmt${i}">
      <button class="btn btn-sm btn-danger" onclick="removeExtraRow(${i})" style="padding:4px 8px">✕</button>
    </div>`);
  window._extraRowCount = i + 1;
  document.getElementById('extraAmt' + i)?.focus();
}

function removeExtraRow(i) {
  const row = document.getElementById('extraRow' + i);
  if (row) row.remove();
}

function saveExtraCosts(staffId, eventId) {
  const key = `${staffId}:${eventId}`;
  const allExtras = load(SK.extraCosts, {});
  const items = [];
  for (let i = 0; i < (window._extraRowCount || 0); i++) {
    const labelEl = document.getElementById('extraLabel' + i);
    const amtEl = document.getElementById('extraAmt' + i);
    if (!labelEl || !amtEl) continue;
    const label = labelEl.value.trim();
    const amount = parseInt(amtEl.value) || 0;
    if (label || amount) items.push({ label, amount });
  }
  if (items.length) allExtras[key] = items;
  else delete allExtras[key];
  save(SK.extraCosts, allExtras);
  closeModal();
  renderPage();
}

// =====================================================
// PREP WORK (事前準備作業)
// =====================================================
function openPrepWorkModal(staffId, editId) {
  const staffs = load(SK.staffs, []);
  const ranks = load(SK.ranks, []);
  const cats = load(SK.cats, []);
  const s = staffs.find(x => x.id === staffId);
  if (!s) return;
  const allPrep = load(SK.prepWork, []);
  const existing = editId ? allPrep.find(pw => pw.id === editId) : null;
  const rank = ranks.find(r => r.id === s.rankId);

  // スタッフのランクに基づく時給を自動算出（最初のカテゴリから）
  let autoRate = 0;
  if (rank && cats.length) {
    const c = cats[0];
    const dw = (c.rankWages && (c.rankWages[rank.id] || c.rankWages[String(rank.id)])) || 0;
    const bSt = c.studyHours || 1;
    const bOp = timeToHours(c.opStart, c.opEnd, c.opBreak||0) || 7;
    autoRate = Math.floor(calcHourlyRate(dw, roundHalfHour(bSt), roundHalfHour(bOp)));
  }

  const existHours = existing ? existing.hours : 0;
  const existH = Math.floor(existHours);
  const existM = Math.round((existHours - existH) * 60);

  const today = new Date().toISOString().slice(0,10);
  openModal(`<div class="modal" style="max-width:420px">
    <div class="modal-header"><h3>${existing ? '事前準備を編集' : '事前準備を追加'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px">${s.name}${rank ? ' （' + rank.label + '）' : ''}</div>
      <div class="form-group">
        <label class="form-label">日付<span class="req">*</span></label>
        <input type="date" class="form-control" id="prepDate" value="${existing ? existing.date : today}">
      </div>
      <div class="form-group">
        <label class="form-label">作業内容<span class="req">*</span></label>
        <input type="text" class="form-control" id="prepDesc" value="${existing ? existing.description || '' : ''}" placeholder="例：資料作成、買い出し等">
      </div>
      <div style="display:flex;gap:10px;align-items:end">
        <div class="form-group" style="flex:1">
          <label class="form-label">作業時間<span class="req">*</span></label>
          <div style="display:flex;align-items:center;gap:4px">
            <input type="number" min="0" class="form-control" id="prepH" value="${existing ? existH : ''}" placeholder="0" style="width:60px" oninput="updatePrepTotal()">
            <span style="font-size:12px">時間</span>
            <input type="number" min="0" max="59" class="form-control" id="prepM" value="${existing ? existM : ''}" placeholder="0" style="width:60px" oninput="updatePrepTotal()">
            <span style="font-size:12px">分</span>
          </div>
        </div>
        <div class="form-group" style="flex:0.7">
          <label class="form-label">時給（円）<span class="req">*</span></label>
          <input type="number" class="form-control" id="prepRate" value="${existing ? existing.hourlyRate : autoRate || ''}" placeholder="例：1200" oninput="updatePrepTotal()">
        </div>
      </div>
      <div id="prepCalcDetail" style="font-size:11px;color:var(--ink-soft);padding:8px 10px;background:var(--surface-2);border-radius:6px;margin-top:8px"></div>
      <div id="prepTotal" style="font-size:14px;font-weight:500;padding:10px;background:var(--accent-light);border-radius:8px;margin-top:8px;text-align:center"></div>
    </div>
    <div class="modal-footer">
      ${existing ? `<button class="btn btn-danger" onclick="deletePrepWork('${editId}')" style="margin-right:auto">削除</button>` : ''}
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="savePrepWork(${staffId},'${editId||''}')">保存</button>
    </div>
  </div>`);
  updatePrepTotal();
}

function updatePrepTotal() {
  const h = parseInt(document.getElementById('prepH')?.value) || 0;
  const m = parseInt(document.getElementById('prepM')?.value) || 0;
  const r = parseInt(document.getElementById('prepRate')?.value) || 0;
  const totalH = h + m / 60;
  const pay = Math.floor(totalH * r);
  const detail = document.getElementById('prepCalcDetail');
  const total = document.getElementById('prepTotal');
  if (detail) detail.innerHTML = `${h}時間${m}分 = ${totalH.toFixed(2)}h × ¥${r.toLocaleString()} = ¥${pay.toLocaleString()}`;
  if (total) total.innerHTML = '<span style="color:var(--accent)">¥' + pay.toLocaleString() + '</span>';
}

function savePrepWork(staffId, editId) {
  const date = document.getElementById('prepDate')?.value;
  const description = document.getElementById('prepDesc')?.value.trim();
  const h = parseInt(document.getElementById('prepH')?.value) || 0;
  const m = parseInt(document.getElementById('prepM')?.value) || 0;
  const hours = h + m / 60;
  const hourlyRate = parseInt(document.getElementById('prepRate')?.value) || 0;

  if (!date) { alert('日付を入力してください'); return; }
  if (!description) { alert('作業内容を入力してください'); return; }
  if (!hours) { alert('作業時間を入力してください'); return; }
  if (!hourlyRate) { alert('時給を入力してください'); return; }

  const allPrep = load(SK.prepWork, []);
  if (editId) {
    const pw = allPrep.find(x => x.id === editId);
    if (pw) { pw.date = date; pw.description = description; pw.hours = hours; pw.hourlyRate = hourlyRate; }
  } else {
    const id = Math.random().toString(36).slice(2, 9);
    allPrep.push({ id, staffId, date, description, hours, hourlyRate });
  }
  save(SK.prepWork, allPrep);
  closeModal();
  renderPage();
}

function deletePrepWork(id) {
  if (!confirm('この事前準備を削除しますか？')) return;
  const allPrep = load(SK.prepWork, []).filter(x => x.id !== id);
  save(SK.prepWork, allPrep);
  closeModal();
  renderPage();
}

// =====================================================
// INIT
// =====================================================
try {
  initMaps();
  renderSidebar();
  renderPage();
} catch(e) {
  document.getElementById('mainContent').innerHTML = '<div style="padding:40px;text-align:center"><h2 style="color:var(--red)">初期化エラー</h2><pre style="text-align:left;font-size:11px;background:var(--surface-2);padding:16px;border-radius:8px;margin-top:16px;white-space:pre-wrap">' + e.message + '\n' + e.stack + '</pre><button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:14px">リロード</button></div>';
  console.error('INIT ERROR:', e);
}

// GAS同期：初回ロード＆20秒ポーリング
fetchFromGAS();
setInterval(fetchFromGAS, 20000);
// 初回ロード時に全データをpush（新しくSYNC_KEYSに追加されたキーの既存データを送信）
setTimeout(() => { if (localStorage.getItem(SK.gasUrl)) schedulePush(); }, 3000);
</script>
</body>
</html>
