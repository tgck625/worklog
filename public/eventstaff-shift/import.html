  .btn:disabled { background: #e5e5ea; color: #8e8e93; cursor: not-allowed; }
  .btn-danger { background: #ff3b30; margin-top: 10px; }

  .result { margin-top: 20px; padding: 14px 16px; border-radius: 10px; font-size: 13px; line-height: 1.7; display: none; }

function parseAttendance(str) {
  // スペース除去して7文字に
  const chars = str.replace(/\s/g,'').split('');
  const att = {};
  chars.forEach((c, i) => {
    att[i + 1] = c === '○' ? 'ok' : c === '×' ? 'ng' : 'unknown';
  });
  return att;
}

async function runImport() {
  const btn = document.getElementById('importBtn');
  const res = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = '処理中...';

  try {
    // スタッフを上書き保存
    localStorage.setItem('staff_mgmt_staffs', JSON.stringify(STAFFS));

    // イベント生成
    const events = RAW_EVENTS.map((row, i) => ({
      id: i + 1,
      name: row[0],
      date: row[1],
      venueId: null,
      categoryId: null,
      requiredCount: 3,
      staffAssignments: [],
      attendance: parseAttendance(row[2]),
      opStart: "10:00",
      opEnd: "17:00",
      opBreak: 0,
      studyHours: 0,
      ldrStudyHours: 0
    }));
    localStorage.setItem('staff_mgmt_events', JSON.stringify(events));

    res.className = 'result ok';
    res.style.display = 'block';
    res.innerHTML = `✅ インポート完了！<br>スタッフ: ${STAFFS.length}名<br>イベント: ${events.length}件`;
    btn.textContent = '完了';
    await pushToGAS();
  } catch(e) {
    res.className = 'result err';
    res.style.display = 'block';
    res.textContent = 'エラー: ' + e.message;
    btn.disabled = false;
    btn.textContent = 'インポート実行（上書き）';
  }
}

async function runStaffOnly() {

  btn.textContent = '処理中...';

    res.className = 'result ok';
    res.style.display = 'block';
    res.innerHTML = `✅ スタッフのみ更新完了！<br>スタッフ: ${STAFFS.length}名（イベントデータは保持）`;

    btn.textContent = 'スタッフのみ更新（イベント保持）';
  }
}

const ALL_KEYS =['staff_mgmt_staffs','staff_mgmt_events','staff_mgmt_venues','staff_mgmt_categories','staff_mgmt_schedule_responses','staff_mgmt_ranks','staff_mgmt_pending_registrations','staff_mgmt_pending_bank','staff_mgmt_staff_col_order'];
const GAS_SK = 'staff_mgmt_es_gas_url';

async function pushToGAS() {
  const url = localStorage.getItem(GAS_SK);
  if (!url) { alert('GAS URLが設定されていません。\n先にindex.htmlの設定画面でGAS URLを設定してください。'); return; }
  const res = document.getElementById('result');
  res.className = 'result ok'; res.style.display = 'block';
  res.textContent = '⟳ GASに送信中…';
  try {
    const data = {};
    ALL_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v) try { data[k] = JSON.parse(v); } catch {} });
    const r = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'saveStaffData', data }) });
    const json = await r.json();
    if (json.ok) { res.textContent = '✅ GASへの送信完了！他のデバイスに反映されます。'; }
    else { res.className = 'result err'; res.textContent = 'GASエラー: ' + (json.error||'不明'); }
  } catch(e) { res.className = 'result err'; res.textContent = '通信エラー: ' + e.message; }
}

function exportData() {
  const data = {};
  ALL_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v) data[k] = JSON.parse(v);
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `eventstaff_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

async function importFromJson() {
  const file = document.getElementById('jsonFile').files[0];
  const res = document.getElementById('result');
  if (!file) { alert('JSONファイルを選択してください'); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k, v]) => localStorage.setItem(k, JSON.stringify(v)));
      res.className = 'result ok';
      res.style.display = 'block';
      res.innerHTML = `✅ インポート完了！<br>${Object.keys(data).length}キーを読み込みました`;
      await pushToGAS();
    } catch(err) {
      res.className = 'result err';
      res.style.display = 'block';
      res.textContent = 'エラー: ' + err.message;
    }
  };
  reader.readAsText(file);
}

function clearAll() {
  if (!confirm('全データを削除しますか？')) return;
  ALL_KEYS.forEach(k => localStorage.removeItem(k));
  const res = document.getElementById('result');
  res.className = 'result ok';
  res.style.display = 'block';
  res.textContent = '🗑️ 全データを削除しました';
}
